const STAFF_PIN = "2026";

(function initLock(){
  const lock = document.getElementById("lockScreen");
  const input = document.getElementById("pinInput");
  const btn = document.getElementById("pinBtn");
  const err = document.getElementById("pinErr");
  function tryUnlock(){
    if (input.value === STAFF_PIN) {
      try { localStorage.setItem("staffUnlocked", "1"); } catch(e){}
      lock.style.display = "none";
    } else {
      err.textContent = "密碼不正確，請重新輸入";
      input.value = "";
      input.focus();
    }
  }
  let already = false;
  try { already = localStorage.getItem("staffUnlocked") === "1"; } catch(e){}
  if (already) { lock.style.display = "none"; }
  btn.addEventListener("click", tryUnlock);
  input.addEventListener("keydown", ev => { if (ev.key === "Enter") tryUnlock(); });
})();

let fbSignedIn = false;
const fbQueue = [];
function fbFlushQueue(){ while (fbQueue.length) fbQueue.shift()(); }
fbAuth.onAuthStateChanged(user => { fbSignedIn = !!user; if (fbSignedIn) fbFlushQueue(); render(); });
fbAuth.signInAnonymously().catch(err => { fbStatus = "offline"; render(); });

let fbStatus = "connecting"; // connecting | live | offline

/* 只寫「這一個欄位」的葉節點，不會動到其他場次/欄位的資料，多裝置同時操作也安全 */
function pushLeaf(path, value){
  const run = () => fbDb.ref(path).set(value).catch(err => { console.warn("寫入失敗", path, err); fbStatus = "offline"; render(); });
  if (fbSignedIn) run(); else fbQueue.push(run);
}

let liveScores = {}, liveFun = {}, liveShoot = {};
/* 記錄「這台裝置剛剛自己改過」的欄位，短時間內不要被剛好慢到的遠端回傳蓋掉，避免畫面閃爍/跳回舊值 */
const recentEdit = {};
function markRecent(key){ recentEdit[key] = Date.now() + 1500; }
function isRecent(key){ return (recentEdit[key] || 0) > Date.now(); }

fbDb.ref("event2026/scores").on("value", snap => {
  const remote = snap.val() || {};
  Object.keys(remote).forEach(id => { if (!isRecent("s:"+id)) liveScores[id] = remote[id]; });
  Object.keys(liveScores).forEach(id => { if (!(id in remote) && !isRecent("s:"+id)) delete liveScores[id]; });
  fbStatus = "live"; render();
}, () => { fbStatus = "offline"; render(); });
fbDb.ref("event2026/fun").on("value", snap => {
  const remote = snap.val() || {};
  Object.keys(remote).forEach(id => { if (!isRecent("f:"+id)) liveFun[id] = remote[id]; });
  render();
}, () => {});
fbDb.ref("event2026/shoot").on("value", snap => {
  const remote = snap.val() || { p:{}, f:{} };
  ["p","f"].forEach(kind => {
    const sub = remote[kind] || {};
    if (!liveShoot[kind]) liveShoot[kind] = {};
    Object.keys(sub).forEach(i => { if (!isRecent("sh:"+kind+":"+i)) liveShoot[kind][i] = sub[i]; });
  });
  render();
}, () => {});

const SHOOTERS = [
  ["002","扈端華(Daniel)","CO"],["1072","吳宇宸(Leo)","CO"],["974","吳彥輝(Nick)","DIB·DMD"],["1050","呂婉慈(Vanessa)","DIB·DMD"],
  ["021","洪崇銘","CO·FAD"],["1069","滕威愷(Andy)","CO·FAD"],["850","范書維(Derek)","FSB·FS1"],["469","陳孟君(Jun)","FSB·FS2"],
  ["591","鄭帆軒","FSB·FS2"],["656","李雯萱(Flora)","FSB·FS2"],["649","林建志(Kenny)","FSB·FS3"],["649","林少睿","FSB·FS3"],
  ["1049","陳立學(Lucas)","FSB·FS3"],["1062","王聖翔(Shuan)","FSB·FS3"],["1073","謝安倪(Annie)","GAO·HRD"],["816","張博凱(Kenny)","MSB·MS1"],
  ["811","張瑋恬(Amy)","MSB·MS2"],["971","林千翔(Coco)","MSB·MS2"],["1068","王漢雍(Mario)","MSB·MS2"],["121","朱俊綱(Stanley)","PSB·PS1"],
  ["334","黃柏盛(Benson)","PSB·PS2"],["1028","洪祥盛(Joshua)","PSB·PS3"],["1037","林宛樺(Lena)","PSB·PS3"],["1056","楊勝傑(Allen)","PSB·PS3"],
  ["1074","廖子鑫(Jason)","PSB·PS3"],["912","陳志明(Raven)","GAO·ITS"],["966","封智翔(Vito)","GAO·ITS"],["P118","黃禎宗(Zong)","FSE·PCMA"],
  ["P147","蘇威諺(Ziv)","FSE·FCMA"]
];

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function fmtHM(min){ const h = Math.floor(min/60), m = min%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
const SPORT_LABEL = { tt:"桌球", bad:"羽球", bb:"籃球" };
const VENUE_LABEL = { "桌1":"🏓 桌1", "桌2":"🏓 桌2", "桌3":"🏓 桌3", "A面":"🏸 羽球A面", "B面":"🏸 羽球B面", "籃球場":"🏀 籃球場" };

/* 未產生勝負前的佔位文字（例如「16強勝者1」） */
function phWin(id){ const lb = MATCHES[id].lb; return lb.indexOf("冠軍賽") >= 0 ? "冠軍" : lb.replace(/-(\d+)$/, "勝者$1"); }
function phLose(id){ return MATCHES[id].lb.replace(/-(\d+)$/, "敗者$1"); }
function scoreOf(id){
  const s = liveScores[id];
  if (!s || s.a === "" || s.b === "" || s.a == null || s.b == null) return null;
  return { a:Number(s.a), b:Number(s.b) };
}
function resolveEntrant(e){
  if (!e) return { text:"", ok:false, bye:false };
  if (e.bye) return { text:"輪空", ok:false, bye:true };
  if (e.name) return { text:e.name, ok:true, bye:false };
  if (e.win)  { const w = winnerOf(MATCHES[e.win]); return w ? { text:w, ok:true, bye:false } : { text:phWin(e.win), ok:false, bye:false }; }
  if (e.lose) { const l = loserOf(MATCHES[e.lose]); return l ? { text:l, ok:true, bye:false } : { text:phLose(e.lose), ok:false, bye:false }; }
  return { text:"", ok:false, bye:false };
}
function winnerOf(m){
  if (!m) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  if (m.b && m.b.bye) return A.ok ? A.text : null;
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  return (s.a > s.b ? A : B).ok ? (s.a > s.b ? A : B).text : null;
}
function loserOf(m){
  if (!m || (m.b && m.b.bye)) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  return (s.a > s.b ? B : A).ok ? (s.a > s.b ? B : A).text : null;
}
function funScore(id){
  const f = liveFun[id];
  if (!f || f.r === "" || f.w === "" || f.r == null || f.w == null) return null;
  return { r:Number(f.r), w:Number(f.w) };
}
function shootVal(kind, i){
  const o = liveShoot[kind];
  const v = o ? o[i] : null;
  return (v === "" || v == null) ? null : Number(v);
}
function shootTop4(){
  const arr = [];
  SHOOTERS.forEach((p, i) => { const v = shootVal("p", i); if (v !== null) arr.push({ i:i, v:v }); });
  arr.sort((a, b) => b.v - a.v || a.i - b.i);
  return arr.slice(0, 4);
}

let state = { view:"schedule", s:"all", q:"" };

/* ===== 共用：數字加減器（可以直接點兩側按鈕，也可以直接點數字輸入） ===== */
function stepperHTML(kind, key, sub, val){
  const v = (val === null || val === undefined) ? "" : val;
  return '<div class="stepper" data-kind="' + kind + '" data-key="' + key + '" data-sub="' + sub + '">' +
    '<button class="stepbtn" data-op="-">－</button>' +
    '<input class="stepval" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="' + esc(v) + '">' +
    '<button class="stepbtn" data-op="+">＋</button>' +
  '</div>';
}

/* ===== 賽程比分 ===== */
function renderSchedule(){
  const q = state.q.trim().toLowerCase();
  const list = Object.keys(MATCHES).map(k => MATCHES[k]).filter(m => !(m.b && m.b.bye));
  const filtered = list.filter(m => {
    if (state.s !== "all" && m.sport !== state.s) return false;
    if (!q) return true;
    const A = resolveEntrant(m.a).text, B = resolveEntrant(m.b).text;
    return (m.gname + " " + m.lb + " " + A + " " + B).toLowerCase().indexOf(q) >= 0;
  });
  if (!filtered.length) return '<div class="empty">找不到符合的場次</div>';
  let html = "";
  filtered.forEach(m => {
    const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
    const s = liveScores[m.id] || {};
    const done = scoreOf(m.id) !== null;
    html += '<div class="card ' + m.sport + (done ? " qual" : "") + '">' +
      '<div class="ctop"><span class="tag">' + SPORT_LABEL[m.sport] + ' · ' + esc(m.gname) + ' ' + esc(m.lb) + '</span>' + (done ? '<span class="savedtag">✓ 已輸入</span>' : "") + '</div>' +
      '<div class="cvenue">' + (m.t && m.t !== "—" ? esc(m.t) + "　" : "") + (VENUE_LABEL[m.v] || esc(m.v||"")) + '</div>' +
      '<div class="scorerow"><span class="pname">' + esc(A.text) + '</span>' + stepperHTML("score", m.id, "a", s.a) + '</div>' +
      '<div class="scorerow"><span class="pname">' + esc(B.text) + '</span>' + stepperHTML("score", m.id, "b", s.b) + '</div>' +
      '<div class="cardfoot"><span class="clearlink" data-clear="score" data-key="' + m.id + '">清除這場比分</span></div>' +
    '</div>';
  });
  return html;
}

/* ===== 趣味競賽 ===== */
function renderFun(){
  let html = "";
  FUN_EVENTS.forEach(e => {
    const f = liveFun[e.id] || {};
    const done = funScore(e.id) !== null;
    html += '<div class="card' + (done ? " qual" : "") + '">' +
      '<div class="ctop"><span class="tag">' + esc(e.name) + '</span>' + (done ? '<span class="savedtag">✓ 已輸入</span>' : "") + '</div>' +
      '<div class="scorerow"><span class="pname">🔴 紅隊</span>' + stepperHTML("fun", e.id, "r", f.r) + '</div>' +
      '<div class="scorerow"><span class="pname">⚪ 白隊</span>' + stepperHTML("fun", e.id, "w", f.w) + '</div>' +
      '<div class="cardfoot"><span class="clearlink" data-clear="fun" data-key="' + e.id + '">清除這項比分</span></div>' +
    '</div>';
  });
  return html;
}

/* ===== 投籃大賽 ===== */
function renderShoot(){
  const top = shootTop4();
  const topSet = {}; top.forEach((t, k) => { topSet[t.i] = k + 1; });
  let html = '<div class="empty" style="padding:10px 4px;text-align:left;color:var(--sub);font-size:12.5px">預賽取前 4 名進總決賽；決賽分數只有晉級者需要填。</div>';
  SHOOTERS.forEach((p, i) => {
    const pv = shootVal("p", i);
    const rk = topSet[i];
    html += '<div class="card' + (rk ? " qual" : "") + '">' +
      '<div class="ctop"><span class="tag">' + esc(p[1]) + '　<span style="color:var(--sub);font-weight:600">' + esc(p[0]) + '</span></span>' + (rk ? '<span class="qualtag">晉級 ' + rk + '</span>' : "") + '</div>' +
      '<div class="scorerow"><span class="pname">預賽得分</span>' + stepperHTML("shootp", i, "p", pv) + '</div>' +
      (rk ? '<div class="scorerow"><span class="pname">決賽得分</span>' + stepperHTML("shootf", i, "f", shootVal("f", i)) + '</div>' : "") +
      '<div class="cardfoot"><span class="clearlink" data-clear="shoot" data-key="' + i + '">清除這位選手的分數</span></div>' +
    '</div>';
  });
  return html;
}

function render(){
  const main = document.getElementById("main");
  if (state.view === "schedule") main.innerHTML = renderSchedule();
  else if (state.view === "fun") main.innerHTML = renderFun();
  else main.innerHTML = renderShoot();

  const statusText = fbStatus === "live" ? "🟢 已連線，比分即時同步" : fbStatus === "offline" ? "🔴 連線中斷，請檢查網路" : "🟡 連線中…";
  document.getElementById("updated").textContent = statusText;
}

/* ===== 共用：讀取／寫入某個計分欄位的目前值 ===== */
function getStepValue(kind, key, sub){
  if (kind === "score") { const cur = liveScores[key] || {}; return cur[sub]; }
  if (kind === "fun") { const cur = liveFun[key] || {}; return cur[sub]; }
  if (kind === "shootp" || kind === "shootf") { const k = kind === "shootp" ? "p" : "f"; return (liveShoot[k] || {})[key]; }
}
function setStepValue(kind, key, sub, v){
  if (kind === "score") {
    const cur = liveScores[key] || {};
    liveScores[key] = Object.assign({}, cur); liveScores[key][sub] = v;
    markRecent("s:"+key);
    pushLeaf("event2026/scores/" + key + "/" + sub, v);
  } else if (kind === "fun") {
    const cur = liveFun[key] || {};
    liveFun[key] = Object.assign({}, cur); liveFun[key][sub] = v;
    markRecent("f:"+key);
    pushLeaf("event2026/fun/" + key + "/" + sub, v);
  } else if (kind === "shootp" || kind === "shootf") {
    const k = kind === "shootp" ? "p" : "f";
    if (!liveShoot[k]) liveShoot[k] = {};
    liveShoot[k][key] = v;
    markRecent("sh:"+k+":"+key);
    pushLeaf("event2026/shoot/" + k + "/" + key, v);
  }
}
/* 把使用者直接打的字串，轉成合法的分數值（非負整數）；打不出數字就當作清空 */
function parseTypedScore(raw){
  raw = String(raw).trim();
  if (raw === "") return "";
  const n = Math.floor(Number(raw));
  return (isNaN(n) || n < 0) ? "" : n;
}

/* ===== 加減按鈕、直接輸入與清除連結事件（用事件代理，畫面會一直重繪） ===== */
document.getElementById("main").addEventListener("click", ev => {
  const clearEl = ev.target.closest("[data-clear]");
  if (clearEl) {
    const kind = clearEl.getAttribute("data-clear"), key = clearEl.getAttribute("data-key");
    if (!confirm("確定清除這筆分數？")) return;
    if (kind === "score") {
      pushLeaf("event2026/scores/" + key + "/a", "");
      pushLeaf("event2026/scores/" + key + "/b", "");
      liveScores[key] = { a:"", b:"" }; markRecent("s:"+key);
    } else if (kind === "fun") {
      pushLeaf("event2026/fun/" + key + "/r", "");
      pushLeaf("event2026/fun/" + key + "/w", "");
      liveFun[key] = { r:"", w:"" }; markRecent("f:"+key);
    } else if (kind === "shoot") {
      pushLeaf("event2026/shoot/p/" + key, "");
      pushLeaf("event2026/shoot/f/" + key, "");
      if (!liveShoot.p) liveShoot.p = {}; if (!liveShoot.f) liveShoot.f = {};
      liveShoot.p[key] = ""; liveShoot.f[key] = "";
      markRecent("sh:p:"+key); markRecent("sh:f:"+key);
    }
    render();
    return;
  }
  const btn = ev.target.closest(".stepbtn");
  if (!btn) return;
  const wrap = btn.closest(".stepper");
  const kind = wrap.getAttribute("data-kind"), key = wrap.getAttribute("data-key"), sub = wrap.getAttribute("data-sub");
  const op = btn.getAttribute("data-op");

  const raw = getStepValue(kind, key, sub);
  let v = (raw === "" || raw == null) ? -1 : Number(raw);
  v = op === "+" ? v + 1 : Math.max(0, v - 1);
  setStepValue(kind, key, sub, v);
  render();
});
/* 直接點數字輸入打字：打完離開欄位（或按完成／Enter）才送出，避免每打一個字就送一次 */
document.getElementById("main").addEventListener("change", ev => {
  const el = ev.target;
  if (!el.classList || !el.classList.contains("stepval")) return;
  const wrap = el.closest(".stepper");
  const kind = wrap.getAttribute("data-kind"), key = wrap.getAttribute("data-key"), sub = wrap.getAttribute("data-sub");
  const v = parseTypedScore(el.value);
  setStepValue(kind, key, sub, v);
  render();
});


document.getElementById("nav").addEventListener("click", ev => {
  const t = ev.target.closest(".navtab");
  if (!t) return;
  document.querySelectorAll(".navtab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  state.view = t.getAttribute("data-v");
  document.getElementById("scheduleControls").style.display = state.view === "schedule" ? "" : "none";
  render();
});
document.getElementById("chips").addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  document.querySelectorAll("#chips .chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.s = c.getAttribute("data-s");
  render();
});
document.getElementById("q").addEventListener("input", ev => { state.q = ev.target.value; render(); });

render();
</script>
