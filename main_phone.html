<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 經采家庭日｜賽事看板（簡易版）</title>
<style>
  :root{
    --paper:#faf8f3; --card:#ffffff; --ink:#2a2f38; --sub:#7c8390; --line:#e7e2d6;
    --tt:#f76707; --bad:#2f9e44; --bb:#c2402a;
    --gold:#c8951f; --live-bg:#fff8e6; --red:#c0392b; --white-team:#4a6076;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:40px;
  }
  header{
    padding:16px 16px 0; border-bottom:1px solid var(--line); background:var(--paper);
    position:sticky; top:0; z-index:6;
  }
  h1{margin:0; font-size:18px; font-weight:800; letter-spacing:.3px;}
  .sub{color:var(--sub); font-size:12px; margin-top:3px; padding-bottom:10px;}

  .nav{display:flex; gap:2px; padding:0 6px; background:var(--paper); position:sticky; top:52px; z-index:6; border-bottom:1px solid var(--line); overflow-x:auto;}
  .nav::-webkit-scrollbar{display:none;}
  .navtab{
    flex:1 0 auto; text-align:center; font-size:12px; font-weight:700; color:var(--sub);
    padding:10px 4px 9px; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap;
  }
  .navtab.active{color:var(--ink); border-bottom-color:var(--gold);}

  .searchrow{padding:10px 16px 0; display:flex; gap:8px; align-items:center;}
  .searchrow input{
    flex:1; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:10px 12px; font-size:15px; font-family:inherit;
  }
  .searchrow input:focus{outline:none; border-color:var(--gold);}
  .chips{display:flex; gap:8px; padding:10px 16px 12px; overflow-x:auto;}
  .chip{
    flex:none; font-size:13.5px; font-weight:700; padding:7px 14px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--card); color:var(--sub); white-space:nowrap;
  }
  .chip.active{color:#fff; border-color:transparent;}
  .chip[data-s="all"].active{background:#3a4250;}
  .chip[data-s="tt"].active{background:var(--tt);}
  .chip[data-s="bad"].active{background:var(--bad);}
  .chip[data-s="bb"].active{background:var(--bb);}
  #grpChips .chip.active{background:#3a4250;}
  #grpChips .chip.active[data-sport="tt"]{background:var(--tt);}
  #grpChips .chip.active[data-sport="bad"]{background:var(--bad);}
  #grpChips .chip.active[data-sport="bb"]{background:var(--bb);}
  #mealChips .chip.active{background:#3a4250;}

  .masktoggle{
    flex:none; font-size:12.5px; font-weight:700; color:var(--gold); background:none; border:1.5px solid var(--gold);
    border-radius:999px; padding:8px 12px; white-space:nowrap;
  }

  main{padding:4px 16px 0;}
  .slot, .round{
    position:sticky; top:97px; z-index:4;
    font-size:14px; font-weight:800; color:var(--ink);
    padding:14px 2px 6px; background:var(--paper);
  }
  .slot .n, .round .n{color:var(--sub); font-weight:600; font-size:12px; margin-left:6px;}
  .slot .note, .round .note{color:var(--sub); font-weight:600; font-size:11px; margin-left:4px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius:10px; padding:11px 13px; margin-bottom:9px;
  }
  .card.tt{border-left-color:var(--tt);}
  .card.bad{border-left-color:var(--bad);}
  .card.bb{border-left-color:var(--bb);}
  .card.live{background:var(--live-bg); border-color:#f0d98a;}
  .card.done{opacity:.68;}
  .row1{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .tag{font-size:11.5px; font-weight:700;}
  .card.tt .tag{color:var(--tt);}
  .card.bad .tag{color:var(--bad);}
  .card.bb .tag{color:var(--bb);}
  .venue{font-size:11.5px; color:var(--sub); font-weight:600;}
  .card.next{border-color:#cfd8e3; border-style:dashed;}
  .live .venue::before{content:"● 進行中　"; color:var(--gold);}
  .live.over .venue::before{content:"● 進行中！　"; color:var(--red);}
  .next .venue::before{content:"○ 下一場　"; color:#5b7ba6; font-weight:800;}
  .vs{font-size:14.5px; margin-top:5px; line-height:1.45; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .vsnames{flex:1; min-width:0;}
  .vsmid{color:var(--sub); font-weight:400; padding:0 4px; font-size:12.5px;}
  .ph{color:var(--sub); font-style:normal;}
  .vsnames .winner{font-weight:800; color:var(--ink);}
  .scorebadge{
    flex:none; font-variant-numeric:tabular-nums; font-weight:800; font-size:15px;
    background:#f2ede1; color:var(--ink); border:1px solid var(--line);
    padding:3px 9px; border-radius:8px; white-space:nowrap;
  }
  .foot{margin-top:6px; font-size:11.5px; color:var(--sub);}
  .refline{font-weight:700; color:var(--ink);}
  .empty{text-align:center; color:var(--sub); padding:40px 20px; font-size:14px;}
  .updated{text-align:center; color:var(--sub); font-size:11.5px; padding:18px 0 4px;}
  .verline{text-align:center; color:var(--sub); font-size:10.5px; padding:0 0 16px; opacity:.75;}

  /* 趣味競賽 */
  .funtotal{display:flex; align-items:center; gap:10px; margin:6px 0 14px;}
  .funteam{flex:1; text-align:center; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px 6px;}
  .funteam.red{border-color:var(--red);}
  .funteam.white{border-color:var(--white-team);}
  .funteam .tname{font-size:13px; font-weight:700; color:var(--sub);}
  .funteam.red .tname{color:var(--red);}
  .funteam.white .tname{color:var(--white-team);}
  .funteam .tbig{font-size:30px; font-weight:800; margin-top:2px;}
  .funteam .tbig small{font-size:13px; font-weight:600; margin-left:2px;}
  .funteam .tcap{font-size:11px; color:var(--sub); margin-top:4px;}
  .funmid{flex:none; text-align:center; font-size:12px; color:var(--sub); font-weight:700; width:52px;}
  .funcard{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 13px; margin-bottom:10px;}
  .funcard h3{margin:0 0 6px; font-size:15px;}
  .funside{display:flex; align-items:center; justify-content:space-between; padding:5px 0; font-size:14px;}
  .funside.win{font-weight:800;}
  .funresult{margin-top:6px; font-size:12.5px; color:var(--gold); font-weight:700;}

  .sectionhd{
    display:flex; align-items:center; justify-content:space-between;
    font-size:14px; font-weight:800; margin:18px 0 8px;
  }
  /* 投籃大賽 */
  .shrow{
    display:flex; align-items:center; gap:7px; font-size:13.5px;
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; margin-bottom:6px;
  }
  .shrow.qual{border-color:var(--bb); background:var(--live-bg);}
  .shrow .sheid{flex:none; color:var(--sub); font-size:11.5px; font-weight:700; min-width:34px;}
  .shrow .shname{flex:1; min-width:0; font-weight:600;}
  .shrow .shunit{display:block; color:var(--sub); font-size:11px; font-weight:600;}
  .shrow .shtag{flex:none; font-size:10.5px; font-weight:800; color:#fff; background:var(--bb); border-radius:6px; padding:2px 6px;}
  .shrow .shsc{flex:none; font-variant-numeric:tabular-nums; font-weight:800; font-size:15px; min-width:30px; text-align:right;}

  .rosterhd{padding:10px 16px 0; display:flex; gap:8px; align-items:center;}
  .rosterhd .rosterttl{flex:none; font-size:14px; font-weight:800; white-space:nowrap;}
  .rosterhd input{
    flex:1; min-width:0; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit;
  }
  .rosterhd input:focus{outline:none; border-color:var(--gold);}
  .rhit{
    background:var(--card); border:1.5px solid var(--gold); border-radius:10px;
    padding:9px 12px; margin-bottom:10px; font-size:13.5px; font-weight:700;
  }
  .rhit .hitteam{font-weight:800;}
  .rhit .hitteam.red{color:var(--red);}
  .rhit .hitteam.white{color:var(--white-team);}
  .rperson.hit{background:rgba(212,175,55,.16); border-radius:6px; padding-left:5px;}
  .rosterbox{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px;}
  .rosterbox.red{border-color:var(--red);}
  .rosterbox.white{border-color:var(--white-team);}
  .rhead{font-size:13.5px; font-weight:800; margin-bottom:6px;}
  .rosterbox.red .rhead{color:var(--red);}
  .rosterbox.white .rhead{color:var(--white-team);}
  .rperson{display:flex; align-items:baseline; gap:6px; font-size:13.5px; padding:4px 0; border-top:1px dashed var(--line);}
  .rperson:first-of-type{border-top:none;}
  .rperson .eng{color:var(--sub); font-size:12px;}
  .rperson .ofname{color:var(--sub); font-size:11.5px; margin-left:2px;}
  .captag{font-size:10.5px; background:var(--gold); color:#fff; border-radius:6px; padding:1px 5px; margin-left:2px;}

  /* 餐點 */
  .mealcard{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px;}
  .mealcard .mtop{font-size:14.5px; font-weight:700;}
  .mealcard .meid{color:var(--sub); font-weight:600; font-size:12.5px; margin-right:6px;}
  .mealcard .meng{color:var(--sub); font-weight:600; font-size:12.5px;}
  .mealcard .mline{font-size:13px; margin-top:5px; color:var(--ink);}
  .mealcard .mline b{font-weight:700;}
</style>
</head>

<header>
  <h1>🗓 2026 經貿 x 經采 運動家庭日</h1>
  <div class="sub">簡易版｜比分送出後自動同步</div>
</header>

  <div class="navtab" data-v="fun">🎯 趣味競賽</div>

  <div class="navtab" data-v="meal">🍱 餐點</div>

  <div class="chips" id="chips">
    <div class="chip active" data-s="all">全部</div>
    <div class="chip" data-s="tt">🏓 桌球</div>
    <div class="chip" data-s="bad">🏸 羽球</div>
    <div class="chip" data-s="bb">🏀 籃球</div>
  </div>
</div>
<div id="bracketControls" style="display:none">
  <div class="chips" id="grpChips"></div>
</div>
<div id="rosterControls" style="display:none">
  <div class="rosterhd">
    <div class="rosterttl">👥 紅白隊名單</div>
    <input id="rq" placeholder="搜尋姓名／英文名／員編">
  </div>
</div>
<div id="mealControls" style="display:none">
  <div class="searchrow">
    <input id="mq" placeholder="搜尋姓名／英文名／員編">
  </div>
  <div class="chips" id="mealChips">
    <div class="chip active" data-t="all">全部</div>
    <div class="chip" data-t="紅隊">🔴 紅隊</div>
    <div class="chip" data-t="白隊">⚪ 白隊</div>
    <div class="chip" data-t="福委">福委</div>
    <div class="chip" data-t="大家長">大家長</div>
  </div>
</div>

<main id="main"></main>
<div class="updated" id="updated"></div>
<div class="verline" id="verline"></div>
<div id="debugBanner" style="display:none; margin:10px 16px; padding:10px 12px; background:#fdecea; border:1px solid #f2b8b5; color:#8a1f11; font-size:12px; border-radius:8px; word-break:break-all;"></div>

<script>
window.addEventListener("error", ev => {
  const b = document.getElementById("debugBanner");
  if (!b) return;
  b.style.display = "block";
  b.textContent = "⚠ 頁面錯誤：" + (ev.message || "未知錯誤") +
    (ev.filename ? "　來源：" + ev.filename + ":" + ev.lineno + ":" + ev.colno : "");
});
window.addEventListener("unhandledrejection", ev => {
  const b = document.getElementById("debugBanner");
  if (!b) return;
  b.style.display = "block";
  b.textContent = "⚠ 未處理的 Promise 錯誤：" + (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason));
});
</script>

    liveRefs = snap.val() || {};

  fbStatus = "offline";

function shootVal(kind, i){
  const o = liveShoot && liveShoot[kind];
  const v = o ? o[i] : null;
  return (v === "" || v == null) ? null : Number(v);
}
function shootTop4(){
  const arr = [];
  SHOOTERS.forEach((p, i) => { const v = shootVal("p", i); if (v !== null) arr.push({ i:i, v:v }); });
  arr.sort((a, b) => b.v - a.v || a.i - b.i);
  return arr.slice(0, 4);
}
function shootTieNote(){
  const arr = [];
  SHOOTERS.forEach((p, i) => { const v = shootVal("p", i); if (v !== null) arr.push(v); });
  if (arr.length < 5) return "";
  arr.sort((a, b) => b - a);
  return arr[3] === arr[4] ? "⚠ 第 4 名同分，現場加賽決定晉級者" : "";
}
function shootRank(finalOnly){
  const top = shootTop4();
  const arr = top.map(t => ({ i:t.i, p:t.v, f:shootVal("f", t.i) })).filter(x => !finalOnly || x.f !== null);
  arr.sort((a, b) => (b.f || 0) - (a.f || 0) || b.p - a.p || a.i - b.i);
  if (finalOnly && (arr.length < top.length || top.length < 4)) return [];
  return arr;
}

/* 未產生勝負前的佔位文字（例如「16強勝者1」） */
function phWin(id){ const lb = MATCHES[id].lb; return lb.indexOf("冠軍賽") >= 0 ? "冠軍" : lb.replace(/-(\d+)$/, "勝者$1"); }
function phLose(id){ return MATCHES[id].lb.replace(/-(\d+)$/, "敗者$1"); }

/* 依即時比分（liveScores）判斷晉級者，邏輯與主控版一致 */
function scoreOf(id){
  const s = liveScores[id];
  if (!s) return null;
  if (s.a === "" || s.b === "" || s.a == null || s.b == null) return null;
  return { a:Number(s.a), b:Number(s.b) };
}
function resolveEntrant(e){
  if (!e) return { text:"", ok:false, bye:false };
  if (e.bye) return { text:"輪空", ok:false, bye:true };
  if (e.name) return { text:e.name, ok:true, bye:false };
  if (e.win)  { const w = winnerOf(MATCHES[e.win]); return w ? { text:w, ok:true, bye:false } : { text:phWin(e.win), ok:false, bye:false }; }
  if (e.lose) { const l = loserOf(MATCHES[e.lose]); return l ? { text:l, ok:true, bye:false } : { text:phLose(e.lose), ok:false, bye:false }; }
  return { text:"", ok:false, bye:false };
}
function winnerOf(m){
  if (!m) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  if (m.b && m.b.bye) return A.ok ? A.text : null;
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  const side = s.a > s.b ? A : B;
  return side.ok ? side.text : null;
}
function loserOf(m){
  if (!m) return null;
  if (m.b && m.b.bye) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  const side = s.a > s.b ? B : A;
  return side.ok ? side.text : null;
}
function getTime(m){ return (liveTimes && liveTimes[m.id]) || m.t; }

function parseRange(t){
  const m = /^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/.exec(t);
  if (!m) return null;
  return { a:(+m[1])*60+(+m[2]), b:(+m[3])*60+(+m[4]) };
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function fmtHM(min){ const h = Math.floor(min/60), m = min%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }

const MATCH_LIST = Object.keys(MATCHES).map(k => MATCHES[k]);

let nowMin = 0;

/* ===== 姓名 → 員編／英文名（供賽程搜尋用） ===== */
const NAME_EID = (function(){
  const F = MEAL_FIELDS, o = {};
  MEAL_ROWS.forEach(r => { if (!o[r[F.NAME]]) o[r[F.NAME]] = String(r[F.EID]); });
  return o;
})();
/* 由「王聖翔(Shuan)/林建志(Kenny)」這類字串取出可搜尋的關鍵字：中文名、英文名、員編 */
const _keysCache = {};
function searchKeysOf(text){
  if (_keysCache[text] != null) return _keysCache[text];
  let out = text;
  text.split("/").forEach(part => {
    const name = part.replace(/\(.*?\)/g, "").trim();
    if (NAME_EID[name]) out += " " + NAME_EID[name];
    if (MEAL_ENG[name]) out += " " + MEAL_ENG[name];
  });
  return (_keysCache[text] = out.toLowerCase());
}

/* ===== 進行中 / 下一場 標示（邏輯與主控版 main_pc.html updateLiveMarks 完全一致） ===== */
function isReady(m){
  return (resolveEntrant(m.a).ok || (m.a && m.a.bye)) && (resolveEntrant(m.b).ok || (m.b && m.b.bye));
}
let liveIds = {}, nextIds = {};
function computeVenueState(){
  // 每個場地只讓「開賽時間最早」且已開賽、未完賽的一場顯示進行中
  const liveByVenue = {};
  MATCH_LIST.forEach(m => {
    const r = parseRange(getTime(m));
    if (!r || winnerOf(m) || !isReady(m)) return;
    if (nowMin < r.a) return;                          // 尚未開賽
    const v = m.v || "_";
    const cur = liveByVenue[v];
    if (!cur || r.a < cur.r.a) liveByVenue[v] = { m:m, r:r };
  });
  liveIds = {};
  Object.keys(liveByVenue).forEach(v => { liveIds[liveByVenue[v].m.id] = liveByVenue[v].r; });
  // 下一場：同場地中，排在進行中那場之後、時間最早的未完賽場次
  nextIds = {};
  Object.keys(liveByVenue).forEach(v => {
    const cur = liveByVenue[v];
    let best = null;
    MATCH_LIST.forEach(m => {
      if (m.id === cur.m.id || (m.v || "_") !== v) return;
      const r = parseRange(getTime(m));
      if (!r || winnerOf(m)) return;
      if (r.a < cur.r.a) return;                       // 早於進行中那場的不算
      if (r.a === cur.r.a && m.id <= cur.m.id) return; // 同時段取後者
      if (!best || r.a < best.r.a) best = { m:m, r:r };
    });
    if (best) nextIds[best.m.id] = true;
  });
  // 該場地尚無進行中場次時：取該場地最早的未完賽場次為下一場
  const venues = {};
  MATCH_LIST.forEach(m => {
    const v = m.v || "_";
    if (liveByVenue[v]) return;
    const r = parseRange(getTime(m));
    if (!r || winnerOf(m)) return;
    if (!venues[v] || r.a < venues[v].r.a) venues[v] = { m:m, r:r };
  });
  Object.keys(venues).forEach(v => { nextIds[venues[v].m.id] = true; });
}
function matchPhase(m){
  if (liveIds[m.id]) {
    const r = liveIds[m.id];
    return (r && nowMin > r.b) ? "live over" : "live";   // 超時加註「！」
  }
  return nextIds[m.id] ? "next" : "";
}

function sideHTML(side, winnerText){
  const isWinner = winnerText && side.ok && side.text === winnerText;
  const label = side.bye ? "輪空" : side.text;
  const cls = (side.ok ? "" : "ph") + (isWinner ? " winner" : "");
  return '<span class="' + cls + '">' + (isWinner ? "🏆 " : "") + esc(label) + '</span>';
}

/* 單一場次卡片，賽程表與對戰表共用；showTime=true 時額外顯示時間（對戰表用，賽程表已用時段標題分組） */
function matchCardHTML(m, showTime){
  const r = parseRange(getTime(m));
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  const w = winnerOf(m);
  const s = scoreOf(m.id);
  const isDone = !!w;
  const phase = isDone ? "" : matchPhase(m);
  const cls = ["card", m.sport, phase, isDone ? "done" : ""].filter(Boolean).join(" ");
  const timeTxt = showTime && getTime(m) && getTime(m) !== "—" ? esc(getTime(m)) + "　" : "";
  const scoreTxt = s ? '<span class="scorebadge">' + s.a + ' : ' + s.b + '</span>' : "";
  // 裁判暫不顯示（改 SHOW_REFS = true 即可恢復：只在「進行中」與「下一場」顯示）
  const ref = (SHOW_REFS && (phase === "next" || phase.indexOf("live") === 0)) ? (liveRefs[m.id] || "") : "";
  const refTxt = ref ? '<div class="foot refline">🚩 裁判　' + esc(ref) + '</div>' : "";
  return '<div class="' + cls + '">' +
    '<div class="row1"><span class="tag">' + SPORT_LABEL[m.sport] + ' · ' + esc(m.gname) + '　' + esc(m.lb) + (m.crown ? "（"+m.crown+"）" : "") + '</span></div>' +
    '<div class="venue">' + timeTxt + (VENUE_LABEL[m.v] || esc(m.v || "")) + '</div>' +
    '<div class="vs">' +
      '<span class="vsnames">' + sideHTML(A, w) + '<span class="vsmid">vs</span>' + sideHTML(B, w) + '</span>' +
      scoreTxt +
    '</div>' +
    (isDone ? '<div class="foot">✓ 已產生結果</div>' : refTxt) +
  '</div>';
}

function renderSchedule(){
  const q = state.q.trim().toLowerCase();
  const items = MATCH_LIST.map(m => ({ m, r: parseRange(getTime(m)) }))
    .sort((x, y) => {
      const ax = x.r ? x.r.a : 9999, ay = y.r ? y.r.a : 9999;
      if (ax !== ay) return ax - ay;
      return (x.m.v || "").localeCompare(y.m.v || "");
    });
  const filtered = items.filter(it => {
    if (state.s !== "all" && it.m.sport !== state.s) return false;
    if (!q) return true;
    const A = resolveEntrant(it.m.a), B = resolveEntrant(it.m.b);
    const hay = (A.ok ? searchKeysOf(A.text) : "") + " " + (B.ok ? searchKeysOf(B.text) : "");
    return hay.indexOf(q) >= 0;
  });
  if (!filtered.length) return '<div class="empty">找不到符合的賽程</div>';
  let html = "", lastSlot = null;
  filtered.forEach(it => {
    const slotLabel = it.r ? (fmtHM(it.r.a) + " – " + fmtHM(it.r.b)) : "時間未定";
    if (slotLabel !== lastSlot) {
      const n = filtered.filter(x => (x.r ? fmtHM(x.r.a)+" – "+fmtHM(x.r.b) : "時間未定") === slotLabel).length;
      html += '<div class="slot">' + esc(slotLabel) + '<span class="n">' + n + ' 場</span>' +
        '<span class="note">（實際時間以現場安排為準）</span></div>';
      lastSlot = slotLabel;
    }
    html += matchCardHTML(it.m, false);
  });
  return html;
}

function renderShootPage(){
  const top = shootTop4();
  const topRank = {}; top.forEach((t, k) => { topRank[t.i] = k + 1; });
  const ranked = shootRank(true);
  const medals = ["🏆 冠軍", "🥈 亞軍", "🥉 季軍", "第 4 名"];
  let doneN = 0;
  SHOOTERS.forEach((p, i) => { if (shootVal("p", i) !== null) doneN++; });

  let html = '<div class="round" style="position:static">★ 總決賽（預賽前 4 名）<span class="n">14:50-15:00　籃球場</span></div>';
  if (!top.length) {
    html += '<div class="empty" style="padding:24px 12px">尚未產生晉級者（預賽成績登記中）</div>';
  } else {
    const order = ranked.length ? ranked.map(x => x.i) : top.map(x => x.i);
    order.forEach(idx => {
      const t = top.find(x => x.i === idx);
      const f = shootVal("f", idx);
      const r = ranked.length ? ranked.findIndex(x => x.i === idx) : -1;
      html += '<div class="card bb' + (r === 0 ? " live" : "") + '">' +
        '<div class="row1"><span class="tag">' + (r >= 0 ? medals[r] : "晉級 " + topRank[idx]) + '</span></div>' +
        '<div class="vs"><span class="vsnames">' + esc(SHOOTERS[idx][1]) + '</span>' +
          '<span class="scorebadge">' + (f === null ? "—" : f) + '</span></div>' +
        '<div class="foot">單位 ' + esc(SHOOTERS[idx][2]) + '　｜　預賽 ' + t.v + ' 分</div>' +
      '</div>';
    });
  }
  const note = shootTieNote();
  if (note) html += '<div class="foot" style="color:var(--red);font-weight:700;margin-bottom:6px">' + note + '</div>';

  html += '<div class="round" style="position:static">預賽成績<span class="n">11:30-13:20　已登記 ' + doneN + '/' + SHOOTERS.length + ' 人</span></div>';
  const rows = SHOOTERS.map((p, i) => ({ p:p, i:i, v:shootVal("p", i) }))
    .sort((a, b) => (b.v === null) - (a.v === null) || (b.v - a.v) || a.i - b.i);
  rows.forEach(r => {
    html += '<div class="shrow' + (topRank[r.i] ? " qual" : "") + '">' +
      '<span class="sheid">' + esc(r.p[0]) + '</span>' +
      '<span class="shname">' + esc(r.p[1]) + '<span class="shunit">' + esc(r.p[2]) + '</span></span>' +
      (topRank[r.i] ? '<span class="shtag">晉級 ' + topRank[r.i] + '</span>' : "") +
      '<span class="shsc">' + (r.v === null ? "—" : r.v) + '</span>' +
    '</div>';
  });
  return html;
}

function renderBracket(){
  if (state.grp === "shoot") return renderShootPage();
  const g = GROUPS.find(x => x.id === state.grp) || GROUPS[0];
  let html = "";
  g.cols.forEach(col => {
    html += '<div class="round">' + esc(col.title) + '<span class="n">' + col.ms.length + ' 場</span>' +
      '<span class="note">（實際時間以現場安排為準）</span></div>';
    col.ms.forEach(m => { html += matchCardHTML(m, true); });
  });
  return html;
}

function rosterHit(r, q){
  if (!q) return false;
  const F = MEAL_FIELDS;
  const hay = (r[F.NAME] + " " + (MEAL_ENG[r[F.NAME]] || "") + " " + r[F.EID] + " " + (r[F.OF] || "")).toLowerCase();
  return hay.indexOf(q) >= 0;
}

function rosterListHTML(team, cls, q){
  const F = MEAL_FIELDS;
  const isCap = n => (CAPTAINS[team] || []).indexOf(n) >= 0;
  const capIdx = r => { const i = (CAPTAINS[team] || []).indexOf(r[F.NAME]); return i < 0 ? 99 : i; };
  const seq = r => (ROSTER_SEQ[r[F.NAME]] != null ? ROSTER_SEQ[r[F.NAME]] : 999);
  const all = MEAL_ROWS.filter(r => r[F.TEAM] === team);
  const list = (q ? all.filter(r => rosterHit(r, q)) : all).sort((a, b) =>
    (capIdx(a) - capIdx(b)) || (seq(a) - seq(b)) || String(a[F.EID]).localeCompare(String(b[F.EID])));
  if (!list.length) return "";
  let h = '<div class="rosterbox ' + cls + '"><div class="rhead">' + esc(team) + '　<span style="font-weight:600;color:var(--sub);font-size:11.5px">' +
    (q ? '符合 ' + list.length + ' 人（全隊 ' + all.length + ' 人）' : '共 ' + all.length + ' 人') + '</span></div>';
  list.forEach(r => {
    const staff = r[F.ROLE] === "同仁";
    const eng = staff ? (MEAL_ENG[r[F.NAME]] || "") : "";
    h += '<div class="rperson' + (q ? " hit" : "") + '">' +
      '<span>' + esc(displayName(r)) +
        (eng ? '<span class="ofname">(' + esc(eng) + ')</span>' : "") +
        (r[F.OF] ? '<span class="ofname">(' + esc(r[F.OF]) + ')</span>' : "") + '</span>' +
      (isCap(r[F.NAME]) ? '<span class="captag">隊長</span>' : "") +
    '</div>';
  });
  return h + "</div>";
}

function renderFun(){
  let winR = 0, winW = 0, doneN = 0;
  FUN_EVENTS.forEach(e => {
    const sc = funScore(e.id);
    if (!sc) return;
    doneN++;
    if (sc.r > sc.w) winR++; else if (sc.w > sc.r) winW++;
  });
  const finished = doneN === FUN_EVENTS.length;
  const status = finished ? (winR === winW ? "🤝 雙方平手" : "🏆 " + (winR > winW ? "紅隊優勝" : "白隊優勝"))
                          : (winR > winW ? "紅隊領先" : (winW > winR ? "白隊領先" : "戰況膠著"));
  let html = '<div class="funtotal">' +
    '<div class="funteam red"><div class="tname">紅隊</div><div class="tbig">' + winR + '<small>勝</small></div>' +
    '<div class="tcap">👑 ' + CAPTAINS["紅隊"].join("、") + '</div></div>' +
    '<div class="funmid">VS<br>' + status + '</div>' +
    '<div class="funteam white"><div class="tname">白隊</div><div class="tbig">' + winW + '<small>勝</small></div>' +
    '<div class="tcap">👑 ' + CAPTAINS["白隊"].join("、") + '</div></div>' +
  '</div>';
  html += '<div class="foot" style="text-align:center;margin-bottom:10px;">共 ' + FUN_EVENTS.length + ' 項，已完成 ' + doneN + '/' + FUN_EVENTS.length + '</div>';
  FUN_EVENTS.forEach(e => {
    const sc = funScore(e.id);
    const rw = sc && sc.r > sc.w, ww = sc && sc.w > sc.r;
    html += '<div class="funcard">' +
      '<h3>' + esc(e.name) + '</h3>' +
      '<div class="funside' + (rw ? " win" : "") + '">🔴 紅隊<span>' + (sc ? sc.r : "—") + '</span></div>' +
      '<div class="funside' + (ww ? " win" : "") + '">⚪ 白隊<span>' + (sc ? sc.w : "—") + '</span></div>' +
      (sc ? '<div class="funresult">' + (sc.r === sc.w ? "🤝 平手" : "🏆 " + (rw ? "紅隊" : "白隊") + "勝") + '</div>' : "") +
    '</div>';
  });
  return html;
}

function renderRoster(){
  const F = MEAL_FIELDS;
  const q = state.rosterQ.trim().toLowerCase();
  let html = "";
  if (q) {
    const hits = MEAL_ROWS.filter(r => rosterHit(r, q));
    if (!hits.length) return '<div class="empty">找不到「' + esc(state.rosterQ.trim()) + '」，請改用姓名／英文名／員編搜尋</div>';
    const teams = [];
    hits.forEach(r => { if (teams.indexOf(r[F.TEAM]) < 0) teams.push(r[F.TEAM]); });
    html += '<div class="rhit">' + hits.slice(0, 6).map(r => {
      const cls = r[F.TEAM] === "紅隊" ? "red" : r[F.TEAM] === "白隊" ? "white" : "";
      const dot = r[F.TEAM] === "紅隊" ? "🔴" : r[F.TEAM] === "白隊" ? "⚪" : "🏅";
      return esc(displayName(r)) + '　→　' + dot + '<span class="hitteam ' + cls + '">' + esc(r[F.TEAM]) + '</span>';
    }).join("<br>") + (hits.length > 6 ? '<br><span style="font-weight:600;color:var(--sub)">…共 ' + hits.length + ' 筆</span>' : "") + '</div>';
  }
  html += rosterListHTML("紅隊", "red", q);
  html += rosterListHTML("白隊", "white", q);
  return html;
}

function renderMeal(){
  const F = MEAL_FIELDS;
  const q = state.mealQ.trim().toLowerCase();
  const filtered = MEAL_ROWS.filter(r => {
    if (state.mealTeam !== "all" && r[F.TEAM] !== state.mealTeam) return false;
    if (!q) return true;
    const eng = (MEAL_ENG[r[F.NAME]] || "").toLowerCase();
    const hay = (r[F.NAME] + " " + eng + " " + r[F.EID]).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  if (!filtered.length) return '<div class="empty">找不到符合的同仁／眷屬</div>';
  let html = "", lastTeam = null;
  filtered.forEach(r => {
    if (r[F.TEAM] !== lastTeam) {
      const n = filtered.filter(x => x[F.TEAM] === r[F.TEAM]).length;
      html += '<div class="slot">' + esc(r[F.TEAM]) + '<span class="n">' + n + ' 人</span></div>';
      lastTeam = r[F.TEAM];
    }
    const eng = engOf(r);
    html += '<div class="mealcard">' +
      '<div class="mtop"><span class="meid">' + esc(r[F.EID]) + '</span>' +
      (eng ? '<span class="meng">' + esc(eng) + '　</span>' : "") +
      esc(displayName(r)) + '</div>' +
      '<div class="mline">🍔 <b>' + esc(mealShort(r[F.MEAL])) + '</b></div>' +
      '<div class="mline">🥤 ' + esc(drinkOf(r[F.DRINK])) + '</div>' +
    '</div>';
  });
  return html;
}

function render(){
  const now = new Date();
  nowMin = now.getHours()*60 + now.getMinutes();
  computeVenueState();

  const main = document.getElementById("main");
  if (state.view === "schedule") main.innerHTML = renderSchedule();
  else if (state.view === "bracket") main.innerHTML = renderBracket();
  else if (state.view === "meal") main.innerHTML = renderMeal();
  else if (state.view === "roster") main.innerHTML = renderRoster();
  else main.innerHTML = renderFun();


  const statusText = fbStatus === "live" ? "🟢 比分即時同步中" : fbStatus === "offline" ? "🔴 比分同步離線（顯示靜態資料）" : "🟡 比分同步連線中…";
  document.getElementById("updated").textContent = "更新時間 " + fmtHM(nowMin) + "　｜　" + statusText;
  document.getElementById("verline").textContent = "經貿 X 經采 EWC　© 2026 EWC · v" + APP_VER;
}

/* ===== 對戰表：賽事分類選單 ===== */
const grpChips = document.getElementById("grpChips");
grpChips.innerHTML = GROUPS.map(g =>
  '<div class="chip' + (g.id === state.grp ? " active" : "") + '" data-grp="' + g.id + '" data-sport="' + g.sport + '">' +
  (g.sport === "tt" ? "🏓 " : g.sport === "bad" ? "🏸 " : "🏀 ") + esc(g.name) + '</div>'
).join("") +
  '<div class="chip' + (state.grp === "shoot" ? " active" : "") + '" data-grp="shoot" data-sport="bb">🏀 投籃大賽</div>';
grpChips.addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  grpChips.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.grp = c.getAttribute("data-grp");
  render();
});

/* ===== 主頁籤切換 ===== */
document.getElementById("nav").addEventListener("click", ev => {
  const t = ev.target.closest(".navtab");
  if (!t) return;
  document.querySelectorAll(".navtab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  state.view = t.getAttribute("data-v");
  document.getElementById("scheduleControls").style.display = state.view === "schedule" ? "" : "none";
  document.getElementById("bracketControls").style.display = state.view === "bracket" ? "" : "none";
  document.getElementById("mealControls").style.display = state.view === "meal" ? "" : "none";
  document.getElementById("rosterControls").style.display = state.view === "roster" ? "" : "none";
  render();
});

document.getElementById("rq").addEventListener("input", ev => { state.rosterQ = ev.target.value; render(); });

document.getElementById("chips").addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  document.querySelectorAll("#chips .chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.s = c.getAttribute("data-s");
  render();
});
document.getElementById("q").addEventListener("input", ev => { state.q = ev.target.value; render(); });

document.getElementById("mealChips").addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  document.querySelectorAll("#mealChips .chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.mealTeam = c.getAttribute("data-t");
  render();
});
document.getElementById("mq").addEventListener("input", ev => { state.mealQ = ev.target.value; render(); });

render();
setInterval(render, 10000);   // 與主控版 updateLiveMarks 相同節奏
</script>
