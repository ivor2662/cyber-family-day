<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 經采家庭日｜賽事即時看板</title>
<style>
  /* ===== 主題變數（預設＝深色計分板） ===== */
  body {
    --navy:#3d6ea5; --red:#e85d4b; --gold:#f2b93b; --paper:#132235; --ink:#e9f0f7; --line:#2e415c; --muted:#7d90a6; --field:#0d1b2c;
    --bg:linear-gradient(160deg,#0a1522 0%,#10233c 55%,#0a1522 100%);
    --rad:10px; --radS:6px; --shadow:0 6px 14px rgba(0,0,0,.4);
    --headbg:#1b3049; --headfg:#a9bdd2; --starhbg:rgba(232,93,75,.18); --starhfg:#ffb3a6;
    --time:#7fc0ff; --timechg:#ff8a75; --winbg:rgba(242,185,59,.14); --wfg:var(--gold);
    --resfg:var(--gold); --silverbg:rgba(255,255,255,.05); --silverfg:#b9c8d8;
    --clockbg:var(--gold); --clockfg:#0a1522; --hdline:var(--gold);
    --progbg:var(--gold); --progfg:#0a1522;
    --rtbg:rgba(61,110,165,.28); --rtfg:var(--gold); --rtbd:var(--navy); --rtls:3px;
    --tabbg:transparent; --hoverbg:rgba(61,110,165,.25); --glow:0 0 12px rgba(61,110,165,.6);
    --alert:#a5342a; --overlay:rgba(4,10,18,.72); --tboxbd:var(--gold); --ok:#7ddc8a; --sepc:#4a617c;
    --h3bg:linear-gradient(90deg,#3d6ea5,#274b72); --rkc:#ff8a75; --ptsc:var(--gold); --h1icon:"\1F3DF  ";
    --nextfg:#0a1522;
  }
  body[data-theme="light"] {
    --navy:#2e6db4; --red:#e0523f; --gold:#e8a71c; --paper:#ffffff; --ink:#16324f; --line:#c9d6e4; --muted:#6d829a; --field:#f4f8fc;
    --bg:linear-gradient(160deg,#eef3f9 0%,#dde7f2 55%,#eef3f9 100%);
    --rad:10px; --radS:6px; --shadow:0 6px 14px rgba(22,50,79,.15);
    --headbg:#e8eff7; --headfg:#4a6076; --starhbg:rgba(224,82,63,.12); --starhfg:#c0392b;
    --time:#1b6fd0; --timechg:#d64530; --winbg:rgba(232,167,28,.18); --wfg:#8a5a00;
    --resfg:#8a5a00; --silverbg:#f1f4f7; --silverfg:#5a6b78;
    --clockbg:#e8a71c; --clockfg:#16324f; --hdline:#e8a71c;
    --progbg:#e8a71c; --progfg:#16324f;
    --rtbg:rgba(46,109,180,.12); --rtfg:#2e6db4; --rtbd:#2e6db4; --rtls:3px;
    --tabbg:transparent; --hoverbg:rgba(46,109,180,.14); --glow:0 0 12px rgba(46,109,180,.35);
    --alert:#c0392b; --overlay:rgba(22,50,79,.4); --tboxbd:#e8a71c; --ok:#1e8e3e; --sepc:#9fb2c6;
    --h3bg:linear-gradient(90deg,#2e6db4,#1e4d85); --rkc:#d64530; --ptsc:#8a5a00; --h1icon:"\1F389  ";
    --nextfg:#16324f;
  }
  body[data-theme="paper"] {
    --navy:#12304a; --red:#c74738; --gold:#efb94b; --paper:#fffdf6; --ink:#193147; --line:#d8d0c2; --muted:#8a97a3; --field:#ffffff;
    --bg:repeating-linear-gradient(0deg,#f3eee2 0,#f3eee2 2px,#f8f5ed 2px,#f8f5ed 7px);
    --rad:0; --radS:0; --shadow:4px 4px 0 rgba(18,48,74,.14);
    --headbg:#eef2f5; --headfg:#50687b; --starhbg:#fbe9e6; --starhfg:#c74738;
    --time:#12304a; --timechg:#c74738; --winbg:#fdf4dd; --wfg:#b8860b;
    --resfg:#8a5a00; --silverbg:#f4f4f2; --silverfg:#5a6b78;
    --clockbg:#12304a; --clockfg:#fff; --hdline:#12304a;
    --progbg:#12304a; --progfg:#fff;
    --rtbg:#12304a; --rtfg:#fff; --rtbd:#12304a; --rtls:0;
    --tabbg:#fffdf6; --hoverbg:#eef2f5; --glow:none;
    --alert:#c74738; --overlay:rgba(18,48,74,.45); --tboxbd:#12304a; --ok:#2e7d32; --sepc:#9da8ae;
    --h3bg:#12304a; --rkc:#c74738; --ptsc:#8a5a00; --h1icon:"";
    --nextfg:#5a4500;
  }
  body[data-theme="festival"] {
    --navy:#7952b3; --red:#e4572e; --gold:#f2a007; --paper:#ffffff; --ink:#33404f; --line:#e6ddd2; --muted:#94a0ad; --field:#faf7f1;
    --bg:linear-gradient(160deg,#fff6ec 0%,#f2f8ff 55%,#fdf1f5 100%);
    --rad:16px; --radS:10px; --shadow:0 8px 18px rgba(90,70,40,.14);
    --headbg:#f6f1ea; --headfg:#7a8794; --starhbg:rgba(228,87,46,.12); --starhfg:#cf4a22;
    --time:#7952b3; --timechg:#e4572e; --winbg:rgba(242,160,7,.16); --wfg:#b07400;
    --resfg:#9a6b00; --silverbg:#f4f4f2; --silverfg:#5a6b78;
    --clockbg:#f2a007; --clockfg:#4a3200; --hdline:#f2a007;
    --progbg:#f2a007; --progfg:#4a3200;
    --rtbg:rgba(121,82,179,.12); --rtfg:var(--navy); --rtbd:var(--navy); --rtls:2px;
    --tabbg:#ffffff; --hoverbg:#f6f1ea; --glow:0 4px 10px rgba(0,0,0,.12);
    --alert:#d9480f; --overlay:rgba(60,50,40,.45); --tboxbd:#f2a007; --ok:#2b8a3e; --sepc:#cbb9a6;
    --h3bg:linear-gradient(90deg,#7952b3,#5f3dc4); --rkc:#e4572e; --ptsc:#9a6b00; --h1icon:"\1F389  ";
    --nextfg:#4a3200;
  }
  /* 慶典風：依球種變色（頁面內容） */
  body[data-theme="festival"] #stage[data-sport="tt"]  { --navy:#f76707; --time:#e8590c; --rtbg:rgba(247,103,7,.12); }
  body[data-theme="festival"] #stage[data-sport="bad"] { --navy:#2f9e44; --time:#2b8a3e; --rtbg:rgba(47,158,68,.12); }
  body[data-theme="festival"] #stage[data-sport="bb"]  { --navy:#c2402a; --time:#b03421; --rtbg:rgba(194,64,42,.12); }
  /* 慶典風：頁籤依球種變色 */
  body[data-theme="festival"] .tab[data-tab="tm"], body[data-theme="festival"] .tab[data-tab="tw"], body[data-theme="festival"] .tab[data-tab="ttall"] { border-color:#f76707; }
  body[data-theme="festival"] .tab.active[data-tab="tm"], body[data-theme="festival"] .tab.active[data-tab="tw"], body[data-theme="festival"] .tab.active[data-tab="ttall"] { background:#f76707; }
  body[data-theme="festival"] .tab[data-tab="bm"], body[data-theme="festival"] .tab[data-tab="bw"], body[data-theme="festival"] .tab[data-tab="bx"], body[data-theme="festival"] .tab[data-tab="badall"] { border-color:#2f9e44; }
  body[data-theme="festival"] .tab.active[data-tab="bm"], body[data-theme="festival"] .tab.active[data-tab="bw"], body[data-theme="festival"] .tab.active[data-tab="bx"], body[data-theme="festival"] .tab.active[data-tab="badall"] { background:#2f9e44; }
  body[data-theme="festival"] .tab[data-tab="bb"], body[data-theme="festival"] .tab[data-tab="bball"] { border-color:#c2402a; }
  body[data-theme="festival"] .tab.active[data-tab="bb"], body[data-theme="festival"] .tab.active[data-tab="bball"] { background:#c2402a; }
  body[data-theme="broadcast"] {
    --navy:#1370c9; --red:#ff4d6d; --gold:#2ee6c9; --paper:#0b1c33; --ink:#eaf6ff; --line:#1e3a5c; --muted:#7fa0bd; --field:#081426;
    --bg:linear-gradient(180deg,#04101f 0%,#0a2038 60%,#04101f 100%);
    --rad:4px; --radS:3px; --shadow:0 6px 16px rgba(0,0,0,.5);
    --headbg:#0e2a4d; --headfg:#9cc3e8; --starhbg:rgba(255,77,109,.18); --starhfg:#ff9eb1;
    --time:#2ee6c9; --timechg:#ff8fa3; --winbg:rgba(46,230,201,.12); --wfg:#2ee6c9;
    --resfg:#2ee6c9; --silverbg:rgba(255,255,255,.05); --silverfg:#b9c8d8;
    --clockbg:#1370c9; --clockfg:#fff; --hdline:#2ee6c9;
    --progbg:#2ee6c9; --progfg:#04101f;
    --rtbg:linear-gradient(90deg,#1370c9,#0b2d55); --rtfg:#fff; --rtbd:transparent; --rtls:3px;
    --tabbg:transparent; --hoverbg:rgba(19,112,201,.25); --glow:0 0 14px rgba(46,230,201,.45);
    --alert:#d90429; --overlay:rgba(2,8,16,.78); --tboxbd:#2ee6c9; --ok:#5df2c8; --sepc:#274a70;
    --h3bg:linear-gradient(90deg,#1370c9,#0b2d55); --rkc:#ff8fa3; --ptsc:#2ee6c9; --h1icon:"\1F4FA  ";
    --nextfg:#04101f;
  }
  body[data-theme="broadcast"] .gtitle, body[data-theme="broadcast"] .rtitle, body[data-theme="broadcast"] #clock { font-style:italic; }
  body[data-theme="broadcast"] .score { font-size:18px; }
  /* ===== 基底樣式（全部吃變數） ===== */
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg) fixed; color:var(--ink); font-family:"Microsoft JhengHei","PingFang TC",sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px 10px; border-bottom:3px solid var(--hdline); flex-wrap:wrap; }
  h1 { margin:0; font-size:26px; letter-spacing:1px; }
  h1::before { content:var(--h1icon); }
  .subtitle { color:var(--muted); font-size:14px; margin-top:2px; }
  #clock { margin-left:auto; background:var(--clockbg); color:var(--clockfg); padding:8px 18px; font-weight:bold; font-size:22px; letter-spacing:2px; border-radius:var(--radS); font-variant-numeric:tabular-nums; }
  .toolbar { display:flex; gap:8px; align-items:center; padding:10px 24px; flex-wrap:wrap; }
  #tabs { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:thin; padding-bottom:6px; }
  #tabs::-webkit-scrollbar { height:6px; }
  #tabs::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
  #tabs .tab, #tabs .tabsep { flex:none; white-space:nowrap; }
  /* 手機／窄螢幕瀏覽時，隱藏用不到的投影控制項（輪播、全螢幕、鎖定編輯、風格切換） */
  @media (max-width:768px) {
    #playBtn, #fsBtn, #lockBtn, #themeSel, #clock { display:none !important; }
  }
  .tab { min-height:42px; font:inherit; font-size:16px; font-weight:bold; border:2px solid var(--navy); background:var(--tabbg); color:var(--ink); padding:0 14px; cursor:pointer; border-radius:var(--radS); }
  a.tab.linktab { display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; }
  .tab:hover { background:var(--hoverbg); }
  .tab.active { background:var(--navy); color:#fff; box-shadow:var(--glow); }
  .tab .champ { color:var(--gold); }
  .btn { min-height:42px; font:inherit; font-size:16px; font-weight:bold; border:2px solid var(--red); background:var(--red); color:#fff; padding:0 14px; cursor:pointer; border-radius:var(--radS); }
  .btn.secondary { background:var(--tabbg); color:var(--ink); border-color:var(--navy); }
  .btn.secondary:hover { background:var(--hoverbg); }
  .btn.on { background:var(--navy); border-color:var(--navy); color:#fff; box-shadow:var(--glow); }
  .btn.secondary.on:hover { background:var(--navy); color:#fff; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  #themeSel { min-height:42px; font:inherit; font-size:15px; font-weight:bold; border:2px solid var(--navy); background:var(--tabbg); color:var(--ink); padding:0 8px; border-radius:var(--radS); cursor:pointer; }
  select option { background:var(--paper); color:var(--ink); }
  .spacer { flex:1; }
  #stage { padding:6px 24px 40px; overflow-x:auto; flex:1 0 auto; }
  #stage.nooverflow { overflow:visible; }
  .gtitle { font-size:22px; font-weight:bold; margin:8px 0 2px; }
  .gtitle .star { color:var(--red); }
  .gsub { color:var(--muted); font-size:14px; margin-bottom:10px; }
  .prog { margin-left:12px; font-size:14px; color:var(--progfg); background:var(--progbg); padding:2px 10px; vertical-align:middle; border-radius:10px; }
  .bracket { position:relative; width:max-content; padding:6px 4px 10px; }
  /* 對戰卡字級隨 A+/A− 縮放（基準 15px） */
  .bracket .rtitle, .bracket .pname, .bracket .result { font-size:1em; }
  .bracket .mhead, .bracket .mref { font-size:.867em; }
  .bracket .mref select { font-size:1em; min-height:2em; }
  .bracket .mtime.changed::after { font-size:.733em; }
  .bracket .score { font-size:1.067em; width:3.25em; min-height:1.875em; }
  .bracket .byetag { font-size:.933em; }
  .bracket .side { min-height:2.267em; }
  .bracket .match.live .mhead::before, .bracket .match.next .mhead::before { font-size:.733em; }
  body[data-theme="broadcast"] .bracket .score { font-size:1.2em; }
  .wires { position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .cols { display:flex; gap:56px; align-items:stretch; }
  .colwrap { display:flex; flex-direction:column; }
  .col { flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:14px; min-width:var(--cardw); }
  .rtitle { text-align:center; font-weight:bold; color:var(--rtfg); background:var(--rtbg); border:1px solid var(--rtbd); padding:4px 0; margin-bottom:4px; font-size:15px; border-radius:var(--radS); letter-spacing:var(--rtls); }
  .match { background:var(--paper); border:2px solid var(--navy); border-radius:var(--rad); box-shadow:var(--shadow); width:var(--cardw); position:relative; overflow:hidden; }
  .match.star { border-color:var(--red); }
  .mhead { display:flex; gap:8px; align-items:center; background:var(--headbg); border-bottom:1px solid var(--line); padding:3px 8px; font-size:13px; color:var(--headfg); }
  .match.star .mhead { background:var(--starhbg); color:var(--starhfg); font-weight:bold; }
  .mtime { font-weight:bold; color:var(--time); }
  .mtime[data-edit] { cursor:pointer; border-bottom:1px dashed currentColor; }
  .mtime.changed { color:var(--timechg); }
  .mtime.changed::after { content:"（改）"; font-size:11px; }
  .match.star .mtime { color:var(--timechg); }
  .mlabel { margin-left:auto; }
  .side { display:flex; align-items:center; gap:6px; padding:5px 8px; min-height:34px; }
  .side + .side { border-top:1px dashed var(--line); }
  .pname { flex:1; font-size:15px; font-weight:bold; line-height:1.25; word-break:break-all; }
  .pname.tbd { color:var(--muted); font-weight:normal; }
  .side.winner { background:var(--winbg); }
  .side.winner .pname::after { content:" \2713"; color:var(--wfg); }
  .score { width:52px; min-height:30px; font:inherit; font-size:16px; font-weight:bold; text-align:center; border:1.5px solid var(--line); background:var(--field); color:var(--ink); border-radius:var(--radS); }
  .score:focus { border-color:var(--gold); outline:none; }
  .mref { display:flex; align-items:center; gap:6px; border-top:1px solid var(--line); padding:3px 8px 5px; font-size:13px; color:var(--muted); }
  .mref select { flex:1; font:inherit; font-size:13px; min-height:26px; border:1px solid var(--line); background:var(--field); color:var(--ink); border-radius:var(--radS); }
  .byetag { color:var(--muted); font-size:14px; }
  .result { border-top:2px solid var(--gold); background:var(--winbg); padding:4px 8px; font-size:15px; font-weight:bold; color:var(--resfg); }
  .result.silver { border-top:1px dashed var(--line); background:var(--silverbg); color:var(--silverfg); }
  .ovwrap { display:flex; gap:20px; flex-wrap:wrap; margin:10px 0 18px; }
  .ovcard { background:var(--paper); border:2px solid var(--navy); border-radius:var(--rad); box-shadow:var(--shadow); min-width:300px; flex:1; max-width:420px; overflow:hidden; }
  .ovcard h3 { margin:0; background:var(--h3bg); color:#fff; font-size:16px; padding:7px 12px; letter-spacing:1px; }
  .ovbody { padding:8px 12px; font-size:15px; }
  .ovchamp { font-weight:bold; font-size:16px; margin-bottom:6px; color:var(--resfg); }
  .ovrow { display:flex; justify-content:space-between; padding:3px 0; border-top:1px dashed var(--line); }
  .ovrow .d { font-weight:bold; color:var(--time); }
  .ovtotal { display:flex; justify-content:space-between; padding:6px 0 2px; border-top:2px solid var(--gold); margin-top:4px; font-weight:bold; font-size:17px; color:var(--resfg); }
  .ovpend { color:var(--muted); padding:10px 0; }
  .fhead, .frow { display:flex; align-items:center; gap:10px; padding:5px 4px; }
  .fhead { font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); font-weight:bold; }
  .frow { border-bottom:1px dashed var(--line); min-height:40px; }
  .frow.winner { background:var(--winbg); border-radius:var(--radS); }
  .frow.out .pname, .frow.out .rk, .frow.out .c3 { opacity:.5; }
  .fhead .c1, .frow .c1 { width:74px; flex:none; }
  .fhead .c2, .frow .c2 { flex:1; }
  .fhead .c3, .frow .c3 { width:88px; flex:none; text-align:center; color:var(--muted); font-weight:bold; }
  .fhead .c4, .frow .c4 { width:132px; flex:none; text-align:right; display:flex; align-items:center; justify-content:flex-end; gap:6px; }
  .frow .c3 small, .frow .c4 small { font-size:11px; font-weight:normal; color:var(--muted); }
  .frow .rk { font-weight:bold; color:var(--rkc); font-size:14px; }
  .frow .pname { font-size:16px; font-weight:bold; }
  .shoottable { border-collapse:collapse; font-size:15px; background:var(--paper); border:2px solid var(--navy); border-radius:var(--rad); overflow:hidden; box-shadow:var(--shadow); }
  .shoottable th { background:var(--navy); color:#fff; font-size:14px; padding:6px 12px; white-space:nowrap; }
  .shoottable td { padding:4px 12px; border-bottom:1px dashed var(--line); text-align:center; white-space:nowrap; }
  .shoottable td.nmcell { text-align:left; font-weight:bold; }
  .shoottable tr.qual { background:var(--winbg); }
  .qualtag { background:var(--gold); color:var(--nextfg); font-size:12px; font-weight:bold; padding:1px 8px; border-radius:8px; }
  .mealtable { border-collapse:collapse; font-size:14px; background:var(--paper); border:2px solid var(--navy); border-radius:var(--rad); overflow:hidden; box-shadow:var(--shadow); margin-bottom:6px; }
  .mealtable th { background:var(--navy); color:#fff; font-size:13px; padding:5px 10px; white-space:nowrap; }
  /* 餐點頁：各區塊表頭捲動時吸附（依餐點發放／依紅白分隊／統計總覽） */
  /* sticky 表頭：border-collapse:collapse 在部分瀏覽器會讓 sticky 失效 → 改 separate */
  #stage.nooverflow .mealtable,
  #stage.nooverflow .regtable { border-collapse:separate; border-spacing:0; overflow:visible; }
  #stage.nooverflow .mealtable th,
  #stage.nooverflow .regtable th { position:sticky; top:0; z-index:20; }
  #stage.nooverflow .regtable td { border-width:0 1px 1px 0; }
  #stage.nooverflow .regtable td:first-child { border-left-width:1px; }
  #stage.nooverflow .regtable th { border-width:0 1px 1px 0; }
  #stage.nooverflow .regtable th:first-child { border-left-width:1px; }
  .mealtable td { padding:3px 10px; border-bottom:1px dashed var(--line); text-align:center; white-space:nowrap; }
  .mealtable td.nmcell { text-align:left; font-weight:bold; }
  .mealtable td.dk { font-weight:normal; }
  .mealtable td.rolecell { font-size:12px; }
  .mealtable td.ofcell { font-size:12px; color:var(--muted); }
  .mealtable td.engcell { color:var(--muted); font-size:13px; }
  .mealtable td.tot { font-weight:bold; color:var(--resfg); }
  .mealtable tr.sumrow td { background:var(--winbg); font-weight:bold; }
  .mealtable tr.taken { opacity:.45; text-decoration:line-through; }
  .mealtable tr.removing { transition:opacity .4s ease; opacity:0; }
  .mealtable input[type=checkbox] { width:18px; height:18px; accent-color:var(--gold); }
  .vtag { background:#2b8a3e; color:#fff; font-size:11px; padding:0 5px; border-radius:6px; }
  .regwrap { display:flex; gap:14px; align-items:flex-start; width:100%; }
  .regwrap.tb { display:block; }
  /* 上下模式：欄寬依內容自動，不強制撐滿；表頭捲動時吸附 */
  .regwrap.tb .regtable { width:auto; min-width:0; }
  .regwrap.tb .regtable td.lft.meal, .regwrap.tb .regtable td.lft.drink { width:auto; }
  .regtable { flex:1; min-width:0; border-collapse:collapse; font-size:14px; background:var(--paper); border:1px solid var(--navy); box-shadow:var(--shadow); }
  .regtable th { background:var(--navy); color:#fff; font-size:13px; padding:5px 6px; border:1px solid var(--navy); white-space:nowrap; }
  .regtable td { padding:3px 6px; border:1px solid var(--line); text-align:center; white-space:nowrap; }
  .regtable td.lft { text-align:left; }
  .regtable td.nm { font-weight:bold; }

firebase.initializeApp(firebaseConfig);
const fbDb = firebase.database();
const fbAuth = firebase.auth();

let fbSignedIn = false;
const fbQueue = [];
function fbFlushQueue() { while (fbQueue.length) { const fn = fbQueue.shift(); fn(); } }
fbAuth.onAuthStateChanged(user => {
  fbSignedIn = !!user;
  if (fbSignedIn) fbFlushQueue();
});
fbAuth.signInAnonymously().catch(err => console.warn("Firebase 匿名登入失敗，比分暫不會同步到手機版：", err));

/* 寫入失敗只記在 console，不在畫面上跳提示（資料庫規則目前僅開放 event2026/scores）
   若要重新在畫面上看到失敗原因，把 FB_SHOW_ERR 改成 true */
const FB_SHOW_ERR = false;
function fbShowError(path, err) {
  console.warn("Firebase 寫入失敗：", path, err);
  if (!FB_SHOW_ERR) return;
  let b = document.getElementById("fbErrBar");
  if (!b) {
    b = document.createElement("div");
    b.id = "fbErrBar";
    b.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:9999;max-width:520px;background:#fdecea;" +
      "border:1px solid #f2b8b5;color:#8a1f11;font-size:12px;line-height:1.5;padding:10px 12px;border-radius:8px;" +
      "box-shadow:0 4px 14px rgba(0,0,0,.15);white-space:pre-wrap;cursor:pointer";
    b.title = "點一下關閉";
    b.onclick = () => b.remove();
    document.body.appendChild(b);
  }
  b.textContent = "⚠ 同步寫入失敗（手機版會看不到這項資料）\n路徑：" + path + "\n原因：" + ((err && err.message) || err);
}
/* 一般寫入：用 update() 只合併有變動的鍵值，不會覆蓋掉其他裝置（例如工作人員手機）剛寫入、
   但這台電腦本機還不知道的資料。這是為了讓「主控版」與「工作人員計分手機版」可以同時寫入同一批資料而不互相蓋掉。 */
function fbWrite(path, value) {
  const run = () => {
    const v = value || {};
    const p = Object.keys(v).length ? fbDb.ref(path).update(v) : Promise.resolve();
    p.catch(err => fbShowError(path, err));
  };
  if (fbSignedIn) run(); else fbQueue.push(run);
}
/* 整包覆蓋／清空：僅用於「重置」這類明確要清掉遠端資料的動作，一般存檔不要用這個 */
function fbWriteFull(path, value) {
  const run = () => fbDb.ref(path).set(value || {}).catch(err => fbShowError(path, err));
  if (fbSignedIn) run(); else fbQueue.push(run);
}
/* 讓外層一般 script 可以呼叫這些函式 */
window.fbPushScores = scores => fbWrite("event2026/scores", scores);
window.fbPushTimes  = times  => fbWriteFull("event2026/times", times);
window.fbPushFun    = fun    => fbWrite("event2026/fun", fun);
window.fbPushShoot  = shoot  => fbWrite("event2026/shoot", shoot);
/* 「清除全部比分」按鈕會呼叫這個，明確把遠端 scores/fun/shoot 整個清空

window.fbResetAll = () => {

  fbWriteFull("event2026/fun", {});
  fbWriteFull("event2026/shoot", {});
};

function scoreOf(id) {
  const s = state.scores[id];
  if (!s) return null;
  if (s.a === "" || s.b === "" || s.a == null || s.b == null) return null;
  return { a:Number(s.a), b:Number(s.b) };
}
function resolveEntrant(e) {
  if (!e) return { name:"", ok:false };
  if (e.bye) return { name:"輪空", ok:false, bye:true };
  if (e.name) return { name:e.name, ok:true };
  if (e.win)  { const w = winnerOf(MATCHES[e.win]);  return w ? {name:w, ok:true} : {name:PH.win[e.win], ok:false}; }
  if (e.lose) { const l = loserOf(MATCHES[e.lose]);  return l ? {name:l, ok:true} : {name:PH.lose[e.lose], ok:false}; }
  return { name:"", ok:false };
}
function winnerOf(m) {
  if (!m) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  if (m.b && m.b.bye) return A.ok ? A.name : null;
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  const side = s.a > s.b ? A : B;
  return side.ok ? side.name : null;
}
function loserOf(m) {
  if (!m) return null;
  if (m.b && m.b.bye) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  const side = s.a > s.b ? B : A;
  return side.ok ? side.name : null;
}

  html += "</tbody></table>";

const MEAL_FIELDS = { NO:0, TEAM:1, GRP:2, DEPT:3, EID:4, NAME:5, ROLE:6, DIET:7, MEAL:8, DRINK:9, OF:10 };
function mealMode() { return ["meal","team","sum","todo"].indexOf(state.mealMode) >= 0 ? state.mealMode : "all"; }
function mealTaken(no) { return !!(state.mealTaken && state.mealTaken[no]); }
function mealShort(i) { return MEAL_TYPES[i].replace(/\s*\+\s*/g, "+"); }
function drinkOf(i) { return DRINK_TYPES[i] || "（未選）"; }
function updateMealProgress() {
  const F = MEAL_FIELDS;
  const takenN = MEAL_ROWS.filter(r => mealTaken(r[F.NO])).length;
  const p = stage.querySelector(".gtitle .prog");
  if (p) p.textContent = "已領取 " + takenN + "/" + MEAL_ROWS.length + " 份";
  stage.querySelectorAll(".mealsec").forEach(sec => {
    const el = sec.querySelector(".mealprog");
    if (!el) return;
    const nos = Array.prototype.map.call(sec.querySelectorAll(".mealchk"), x => x.getAttribute("data-no"));
    const done = nos.filter(n => mealTaken(n)).length;
    el.textContent = "已領 " + done + "/" + nos.length;
  });
}
function renderMeal() {
  const F = MEAL_FIELDS;
  const mode = mealMode();
  const takenN = MEAL_ROWS.filter(r => mealTaken(r[F.NO])).length;
  let html = '<div class="gtitle">🍔 餐點登記　<span class="prog">已領取 ' + takenN + "/" + MEAL_ROWS.length + " 份</span></div>";
  html += '<div class="gsub">2026 經貿 x 經采 運動家庭日｜共 ' + MEAL_ROWS.length + ' 份（同仁 ' +
          MEAL_ROWS.filter(r => r[F.ROLE] === "同仁").length + ' 人／眷屬 ' + MEAL_ROWS.filter(r => r[F.ROLE] !== "同仁").length + ' 人；素食 ' +
          MEAL_ROWS.filter(r => r[F.DIET] === "素食").length + ' 份）</div>';
  html += '<div class="prow" style="margin:0 0 12px">' +
    ["sum:📊 統計總覽", "all:📋 點餐一覽", "meal:🍟 依餐點發放", "team:🚩 依紅白分隊", "todo:📮 未領取名單"].map(x => {
      const k = x.split(":")[0];
      let label = x.split(":")[1];
      if (k === "all" && mode === "all") label += "（" + (state.mealLayout === "tb" ? "上下" : "左右") + "）";
      return '<button class="btn secondary' + (mode === k ? " on" : "") + '" data-mealmode="' + k + '"' +
             (k === "all" ? ' title="再按一次可切換左右／上下排列"' : "") + ">" + label + "</button>";
    }).join("") +
    '<label class="stickychk"><input type="checkbox" id="stickyHdr"' + (state.mealSticky ? " checked" : "") + ">固定標頭</label></div>";

  if (mode === "sum") {
    // 餐點 × 飲品 交叉統計
    const dOrder = [];
    DRINK_TYPES.forEach((d, i) => { if (d) dOrder.push(i); });
    const noneIdx = DRINK_TYPES.indexOf("");
    html += '<table class="mealtable"><thead><tr><th style="text-align:left">餐點選擇</th>' +
      dOrder.map(i => "<th>" + esc(DRINK_TYPES[i]) + "</th>").join("") + "<th>未選飲品</th><th>小計</th></tr></thead><tbody>";
    MEAL_TYPES.map((mt, mi) => ({ mt:mt, mi:mi })).sort((a, b) => a.mt.localeCompare(b.mt, "zh-Hant")).forEach(o => {
      const sub = MEAL_ROWS.filter(r => r[F.MEAL] === o.mi);
      html += '<tr><td class="nmcell">' + esc(o.mt) + "</td>" +
        dOrder.map(i => "<td>" + (sub.filter(r => r[F.DRINK] === i).length || "－") + "</td>").join("") +
        "<td>" + (noneIdx >= 0 ? (sub.filter(r => r[F.DRINK] === noneIdx).length || "－") : "－") + "</td>" +
        '<td class="tot">' + sub.length + "</td></tr>";
    });
    html += '<tr class="sumrow"><td class="nmcell">合計</td>' +
      dOrder.map(i => "<td>" + MEAL_ROWS.filter(r => r[F.DRINK] === i).length + "</td>").join("") +
      "<td>" + (noneIdx >= 0 ? MEAL_ROWS.filter(r => r[F.DRINK] === noneIdx).length : 0) + "</td>" +
      '<td class="tot">' + MEAL_ROWS.length + "</td></tr></tbody></table>";
    // 分隊與部門統計
    html += '<div class="ovwrap" style="margin-top:16px">';
    const cnt = (key, val) => MEAL_ROWS.filter(r => r[key] === val).length;
    html += '<div class="ovcard"><h3>依分隊</h3><div class="ovbody">';
    ["大家長", "福委", "紅隊", "白隊"].forEach(t => {
      const sub = MEAL_ROWS.filter(r => r[F.TEAM] === t);
      if (!sub.length) return;
      html += '<div class="ovrow"><span>' + esc(t) + "</span><span class=\"d\">" + sub.length + " 份（同仁 " +
        sub.filter(r => r[F.ROLE] === "同仁").length + "／眷屬 " + sub.filter(r => r[F.ROLE] !== "同仁").length + "）</span></div>";
    });
    html += "</div></div>";
    const depts = {};
    MEAL_ROWS.forEach(r => { depts[r[F.DEPT]] = (depts[r[F.DEPT]] || 0) + 1; });
    html += '<div class="ovcard"><h3>依部門</h3><div class="ovbody">';
    Object.keys(depts).sort((a, b) => depts[b] - depts[a]).forEach(dp => {
      html += '<div class="ovrow"><span>' + esc(dp) + '</span><span class="d">' + depts[dp] + " 份</span></div>";
    });
    html += "</div></div></div>";
  } else if (mode === "all") {
    // 投影用：仿登記表，左右各半（左＝前半、右＝後半）
    const list = MEAL_ROWS.slice().sort((a, b) => (Number(a[F.GRP]) - Number(b[F.GRP])) || a[F.NO] - b[F.NO]);
    const half = Math.ceil(list.length / 2);
    const cols = ["組別", "部門", "單位", "員編", "英文名", "姓名", "身份", "餐食", "餐點選擇", "飲品選擇"];
    const tbl = arr => {
      let h = '<table class="regtable"><thead><tr>' + cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      arr.forEach(r => {
        const staff = r[F.ROLE] === "同仁";
        h += '<tr id="mealrow-' + r[F.NO] + '" class="' + (r[F.DIET] === "素食" ? "vege " : "") + (mealTaken(r[F.NO]) ? "taken" : "") + '">' +
          "<td>" + esc(r[F.GRP]) + "</td><td>" + esc(r[F.DEPT]) + "</td><td>" + esc(unitOf(r[F.NAME])) + "</td><td>" + esc(r[F.EID]) + "</td>" +
          '<td class="lft">' + esc(staff ? (MEAL_ENG[r[F.NAME]] || "") : "") + "</td>" +
          '<td class="nm">' + esc(staff ? r[F.NAME] : maskName(r[F.NAME])) + "</td>" +
          '<td class="role">' + roleDisp(r[F.ROLE]) + "</td><td>" + esc(r[F.DIET]) + "</td>" +
          '<td class="lft meal">' + esc(MEAL_TYPES[r[F.MEAL]]) + "</td>" +
          '<td class="lft drink">' + esc(DRINK_TYPES[r[F.DRINK]] || "") + "</td></tr>";
      });
      return h + "</tbody></table>";
    };
    html += '<div class="regwrap' + (state.mealLayout === "tb" ? " tb" : "") + '">' +
      (state.mealLayout === "tb" ? tbl(list) : tbl(list.slice(0, half)) + tbl(list.slice(half))) + "</div>";
  } else if (mode === "meal") {
    // 依餐點分區，內含飲品分組
    MEAL_TYPES.map((mt, mi) => ({ mt:mt, mi:mi })).sort((a, b) => a.mt.localeCompare(b.mt, "zh-Hant")).forEach(o => {
      const sub = MEAL_ROWS.filter(r => r[F.MEAL] === o.mi)
        .sort((a, b) => (a[F.DRINK] - b[F.DRINK]) || String(a[F.EID]).localeCompare(String(b[F.EID])) || (a[F.ROLE] === "同仁" ? -1 : 1));
      if (!sub.length) return;
      const done = sub.filter(r => mealTaken(r[F.NO])).length;
      html += '<div class="mealsec"><div class="mealhd">▼ ' + esc(o.mt) + "　共 " + sub.length + " 份　" +
        '<span class="mealprog">已領 ' + done + "/" + sub.length + "</span></div>";
      html += '<table class="mealtable"><thead><tr><th>飲品</th><th>員編</th><th>英文名</th><th style="text-align:left">姓名</th><th>身份</th><th>部門</th><th>所屬同仁</th><th>領取</th></tr></thead><tbody>';
      sub.forEach(r => {
        html += '<tr id="mealrow-' + r[F.NO] + '" class="' + (mealTaken(r[F.NO]) ? "taken" : "") + (r[F.DIET] === "素食" ? " vege" : "") + '">' +
          '<td class="nmcell dk">' + esc(drinkOf(r[F.DRINK])) + "</td><td>" + esc(r[F.EID]) + '</td><td class="engcell">' + esc(engOf(r)) + '</td><td class="nmcell">' + esc(r[F.NAME]) +
          (r[F.DIET] === "素食" ? ' <span class="vtag">素</span>' : "") + '</td><td class="rolecell">' + roleDisp(r[F.ROLE]) + "</td><td>" + esc(r[F.DEPT]) + '</td><td class="ofcell">' + esc(r[F.OF] || "—") + "</td>" +
          '<td><input type="checkbox" class="mealchk" data-no="' + r[F.NO] + '"' + (mealTaken(r[F.NO]) ? " checked" : "") + "></td></tr>";
      });
      html += "</tbody></table></div>";
    });
  } else {
    const todoOnly = (mode === "todo");
    if (todoOnly) {
      const left = MEAL_ROWS.filter(r => !mealTaken(r[F.NO])).length;
      html += '<div class="gsub" style="font-size:16px;font-weight:bold;color:var(--rkc)">尚未領取 ' + left + " 份" +
        (left === 0 ? "　🎉 全部發放完畢" : "") + "</div>";
    }
    ["大家長", "福委", "紅隊", "白隊"].forEach(t => {
      const sub = MEAL_ROWS.filter(r => r[F.TEAM] === t && (!todoOnly || !mealTaken(r[F.NO])))
        .sort((a, b) => String(a[F.EID]).localeCompare(String(b[F.EID])) || (a[F.ROLE] === "同仁" ? -1 : 1));
      if (!sub.length) return;
      const done = sub.filter(r => mealTaken(r[F.NO])).length;
      html += '<div class="mealsec team-' + (t === "紅隊" ? "red" : (t === "白隊" ? "white" : "other")) + '"><div class="mealhd">▼ ' + esc(t) +
        (todoOnly ? "　未領 " + sub.length + " 份" : "　共 " + sub.length + " 份") +
        "（同仁 " + sub.filter(r => r[F.ROLE] === "同仁").length + "／眷屬 " + sub.filter(r => r[F.ROLE] !== "同仁").length +
        "；素食 " + sub.filter(r => r[F.DIET] === "素食").length + "）" +
        (todoOnly ? "" : '　<span class="mealprog">已領 ' + done + "/" + sub.length + "</span>") + "</div>";
      html += '<table class="mealtable"><thead><tr><th>員編</th><th>英文名</th><th style="text-align:left">姓名</th><th>身份</th><th>部門</th><th style="text-align:left">餐點</th><th>飲品</th><th>所屬同仁</th><th>領取</th></tr></thead><tbody>';
      sub.forEach(r => {
        html += '<tr id="mealrow-' + r[F.NO] + '" class="' + (mealTaken(r[F.NO]) ? "taken" : "") + (r[F.DIET] === "素食" ? " vege" : "") + '">' +
          "<td>" + esc(r[F.EID]) + '</td><td class="engcell">' + esc(engOf(r)) + '</td><td class="nmcell">' + esc(r[F.NAME]) + (r[F.DIET] === "素食" ? ' <span class="vtag">素</span>' : "") +
          '</td><td class="rolecell">' + roleDisp(r[F.ROLE]) + "</td><td>" + esc(r[F.DEPT]) + '</td><td class="nmcell">' + esc(mealShort(r[F.MEAL])) + '</td><td class="nmcell dk">' + esc(drinkOf(r[F.DRINK])) + '</td><td class="ofcell">' + esc(r[F.OF] || "—") + "</td>" +
          '<td><input type="checkbox" class="mealchk" data-no="' + r[F.NO] + '"' + (mealTaken(r[F.NO]) ? " checked" : "") + "></td></tr>";
      });
      html += "</tbody></table></div>";
    });
  }
  stage.innerHTML = '<div style="zoom:' + getZoom() + '">' + html + "</div>";
}

function renderRoster() {
  const F = MEAL_FIELDS;
  const isCap = (t, n) => (CAPTAINS[t] || []).indexOf(n) >= 0;
  const card = (t, cls) => {
    const seq = r => (ROSTER_SEQ[r[F.NAME]] != null ? ROSTER_SEQ[r[F.NAME]] : 999);
    const capIdx = r => { const i = (CAPTAINS[t] || []).indexOf(r[F.NAME]); return i < 0 ? 99 : i; };

/* ===== 進行中 / 下一場 標示 ===== */
function isReady(m) {
  return (resolveEntrant(m.a).ok || (m.a && m.a.bye)) && (resolveEntrant(m.b).ok || (m.b && m.b.bye));
}
/* 計算「進行中 / 下一場」；對戰圖與賽程總表共用同一套規則 */
function computeLiveNext(nowMin) {
  // 全賽事掃描：每個場地（桌1/桌2/桌3/A面/B面/籃球場）只讓「開賽時間最早」的一場顯示進行中
  const liveByVenue = {};
  Object.keys(MATCHES).forEach(k => {
    const m = MATCHES[k];
    const r = parseRange(getTime(m));
    if (!r || winnerOf(m) || !isReady(m)) return;
    if (nowMin < r.a) return;                    // 尚未開賽
    const v = m.v || "_";
    const cur = liveByVenue[v];
    if (!cur || r.a < cur.r.a) liveByVenue[v] = { m:m, r:r };
  });
  const liveIds = {};
  Object.keys(liveByVenue).forEach(v => { liveIds[liveByVenue[v].m.id] = liveByVenue[v].r; });
  // 「下一場」：同場地中，排在進行中那場之後、時間最早的未完賽場次（依賽程時間，不看現在時刻）
  const nextIds = {};
  Object.keys(liveByVenue).forEach(v => {
    const cur = liveByVenue[v];
    let best = null;
    Object.keys(MATCHES).forEach(k => {
      const m = MATCHES[k];
      if (m.id === cur.m.id || (m.v || "_") !== v) return;
      const r = parseRange(getTime(m));
      if (!r || winnerOf(m)) return;
      if (r.a < cur.r.a) return;                       // 早於進行中那場的不算
      if (r.a === cur.r.a && m.id <= cur.m.id) return; // 同時段取後者
      if (!best || r.a < best.r.a) best = { m:m, r:r };
    });
    if (best) nextIds[best.m.id] = true;
  });
  // 該場地尚無進行中場次時（例如全部未開始或都已完賽）：取該場地最早的未完賽場次為下一場
  const venues = {};
  Object.keys(MATCHES).forEach(k => {
    const m = MATCHES[k];
    const v = m.v || "_";
    if (liveByVenue[v]) return;
    const r = parseRange(getTime(m));
    if (!r || winnerOf(m)) return;
    if (!venues[v] || r.a < venues[v].r.a) venues[v] = { m:m, r:r };
  });
  Object.keys(venues).forEach(v => { nextIds[venues[v].m.id] = true; });
  return { liveIds:liveIds, nextIds:nextIds };
}
function updateLiveMarks() {
  const g = GROUPS.find(x => x.id === state.tab);
  if (!g) return;
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const ln = computeLiveNext(nowMin);
  const liveIds = ln.liveIds, nextIds = ln.nextIds;

  g.cols.forEach(c => c.ms.forEach(m => {
    const el = document.getElementById("card-" + m.id);
    if (!el) return;
    const r = parseRange(getTime(m));
    const live = !!liveIds[m.id];
    el.classList.toggle("live", live);
    const hd = el.querySelector(".mhead");
    if (hd) hd.setAttribute("data-over", live && r && nowMin > r.b ? "！" : "");
    el.classList.toggle("next", !live && !!nextIds[m.id]);
  }));
}

function findConflicts() {
  const entries = [];
  Object.keys(MATCHES).forEach(k => {
    const m = MATCHES[k];
    if (m.b && m.b.bye) return;
    if (winnerOf(m)) return;
    const r = parseRange(getTime(m));
    if (!r) return;
    ["a","b"].forEach(kk => {
      const e = resolveEntrant(kk === "a" ? m.a : m.b);
      if (!e.ok) return;
      e.name.split("/").forEach(n => { n = n.trim(); if (n) entries.push({ n:n, m:m, r:r }); });
    });
  });
  const out = [], seen = {};
  for (let i = 0; i < entries.length; i++) for (let j = i + 1; j < entries.length; j++) {
    const a = entries[i], b = entries[j];
    if (a.n !== b.n || a.m.id === b.m.id) continue;
    if (a.r.a < b.r.b && b.r.a < a.r.b) {
      const key = a.n + "|" + [a.m.id, b.m.id].sort().join("|");
      if (!seen[key]) { seen[key] = 1; out.push({ n:a.n, m1:a.m, m2:b.m }); }
    }
  }
  // 裁判衝突：已指派裁判在該時段有出賽或任裁判其他場
  Object.keys(state.refs).forEach(id => {
    const name = state.refs[id];
    const m = MATCHES[id];
    if (!name || !m || winnerOf(m)) return;
    const r = parseRange(getTime(m));
    if (!r) return;
    if (isPlayerIn(name, m)) {
      const key = "RS|" + name + "|" + id;
      if (!seen[key]) { seen[key] = 1; out.push({ n:name, ref:true, self:true, m1:m }); }
    }
    engagementsOf(name, id).filter(e => overlapR(e.r, r)).forEach(e => {
      const key = "R|" + name + "|" + [id, e.m.id].sort().join("|");
      if (!seen[key]) { seen[key] = 1; out.push({ n:name, ref:true, m1:m, m2:e.m, role:e.role }); }
    });
  });
  return out;
}

  const bar = document.getElementById("conflictBar");

    if (c.ref) return "【裁判】" + esc(c.n) + "：任裁判 " + part(c.m1) + " × " + c.role + " " + part(c.m2);

}

function drawWires() {
  const bracket = stage.querySelector(".bracket");
  if (!bracket) return;
  const svg = bracket.querySelector(".wires");
  const br = bracket.getBoundingClientRect();
  svg.setAttribute("width", bracket.scrollWidth);
  svg.setAttribute("height", bracket.scrollHeight);
  let paths = "";
  const g = GROUPS.find(x => x.id === state.tab) || GROUPS[0];
  g.cols.forEach(c => c.ms.forEach(m => {
    ["a","b"].forEach(k => {
      const e = k === "a" ? m.a : m.b;
      if (!e || (!e.win && !e.lose)) return;
      const srcId = e.win || e.lose;
      const src = document.getElementById("card-" + srcId);
      const dst = document.getElementById("card-" + m.id);
      if (!src || !dst) return;
      const sr = src.getBoundingClientRect();
      const sideEls = dst.querySelectorAll(".side");
      const dr = (sideEls[k === "a" ? 0 : 1] || dst).getBoundingClientRect();
      const x1 = sr.right - br.left, y1 = sr.top + sr.height/2 - br.top;
      const x2 = dr.left - br.left, y2 = dr.top + dr.height/2 - br.top;
      const mx = (x1 + x2) / 2;
      const resolved = resolveEntrant(e).ok;
      const WIRE = { dark:{w:"#f2b93b",l:"#e85d4b",p:"#3a4f6b"}, light:{w:"#e8a71c",l:"#e0523f",p:"#b6c6d8"}, paper:{w:"#b8860b",l:"#c74738",p:"#b9c2ca"}, festival:{w:"#f2a007",l:"#e4572e",p:"#d8cfc4"}, broadcast:{w:"#2ee6c9",l:"#ff4d6d",p:"#204468"} };
      const wc = WIRE[curTheme] || WIRE.dark;
      const color = e.lose ? wc.l : wc.w;
      paths += '<path d="M' + x1 + " " + y1 + " C" + mx + " " + y1 + "," + mx + " " + y2 + "," + x2 + " " + y2 + '" fill="none" stroke="' +
        (resolved ? color : wc.p) + '" stroke-width="' + (resolved ? 3 : 2) + '"' +
        (resolved ? "" : ' stroke-dasharray="6 5"') + (e.lose ? ' opacity="0.75"' : "") + "/>";
    });
  }));
  svg.innerHTML = paths;
}

let timer = null;

const SCROLL_PAUSE = 1.2;     // 到頂/到底停頓秒數

function startAutoScroll() {
  stopAutoScroll();
  const doc = document.scrollingElement || document.documentElement;
  let dir = 1, last = null, hold = SCROLL_PAUSE; // 先在頂端停一下
  function step(ts) {
    if (last == null) last = ts;
    const dt = Math.min(0.1, (ts - last) / 1000);
    last = ts;
    const max = doc.scrollHeight - window.innerHeight;
    if (max > 20) {
      if (hold > 0) { hold -= dt; }
      else {
        let y = doc.scrollTop + dir * scrollSpeed() * dt;
        if (y >= max) { y = max; dir = -1; hold = SCROLL_PAUSE; }
        if (y <= 0)   { y = 0;   dir = 1;  hold = SCROLL_PAUSE; }
        doc.scrollTop = y;
      }
    }
    scrollAnim = requestAnimationFrame(step);
  }
  scrollAnim = requestAnimationFrame(step);
}
/* 頒獎：依序揭曉下一段（滑鼠左鍵或 ↓ 鍵） */
function awardsAdvance() {
  if (state.tab !== "awards" || awStage >= 3) return;
  awStage++;

  if (wrap) wrap.setAttribute("data-stage", awStage);

    const h = document.getElementById("awHint");

  }
  // 新出現的卡片若被擋住 → 緩緩往下捲
  const newSel = awStage === 2 ? ".aw-bb, .aw-shoot" : ".aw-bad";
  const scrollDist = awStage === 2 ? 180 : 260;
  setTimeout(() => {
    let blocked = false;
    stage.querySelectorAll(newSel).forEach(c => {
      const r = c.getBoundingClientRect();
      if (r.bottom > window.innerHeight) blocked = true;
    });
    if (blocked) slowScrollBy(scrollDist);
  }, 300);

}
function slowScrollBy(dist) {
  const startY = window.scrollY;
  const t0 = performance.now();
  const dur = 900;
  const step = ts => {
    const k = Math.min(1, (ts - t0) / dur);
    const ease = 1 - Math.pow(1 - k, 3);
    window.scrollTo(0, startY + dist * ease);
    if (k < 1) requestAnimationFrame(step);
  };

}

/* ===== 全域搜尋 ===== */
const searchBox = document.getElementById("searchBox");
const searchResults = document.getElementById("searchResults");
const EID_BY_NAME = {};
(function () {
  const F = MEAL_FIELDS;
  MEAL_ROWS.forEach(r => { EID_BY_NAME[r[F.NAME]] = r[F.EID]; });
})();
/* 取隊伍字串中每個人的員編與英文名，供搜尋比對（不影響畫面顯示） */
function idHints(str) {
  if (!str) return "";
  let out = "";
  String(str).split("/").forEach(n => {
    const cn = n.replace(/\(.*?\)/g, "").trim();
    if (!cn) return;
    if (EID_BY_NAME[cn]) out += " " + EID_BY_NAME[cn];
    if (MEAL_ENG[cn]) out += " " + MEAL_ENG[cn];
    if (MEAL_INFO[cn] && MEAL_INFO[cn][1]) out += " " + MEAL_INFO[cn][1];
  });
  return out;
}
function doSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { searchResults.style.display = "none"; searchResults.innerHTML = ""; return; }
  const out = [];
  const mealOnly = state.tab === "meal";
  if (!mealOnly) Object.keys(MATCHES).forEach(k => {
    const m = MATCHES[k];
    const A = resolveEntrant(m.a).name || "", B = resolveEntrant(m.b).name || "";
    const ref = state.refs[m.id] || "";
    const roles = [];
    if ((A + "/" + B + idHints(A) + idHints(B)).toLowerCase().indexOf(q) >= 0) roles.push("出賽");
    if ((ref + idHints(ref)).toLowerCase().indexOf(q) >= 0) roles.push("裁判");
    if (m.lb.toLowerCase().indexOf(q) >= 0) roles.push("場次");
    if (roles.length) {
      out.push({ go:"m:" + m.id,
        t1: SPORT_ICON[m.sport] + " " + groupNameOf(m.group) + "　" + m.lb + "　" + getTime(m) + (m.v ? "（" + m.v + "）" : ""),
        t2: A + " vs " + B + (ref ? "｜裁判：" + ref : "") + "｜" + roles.join("、") });
    }
  });
  if (!mealOnly) SHOOTERS.forEach((pp, i) => {
    if ((pp[0] + pp[1] + pp[2]).toLowerCase().indexOf(q) >= 0) {
      const v = shootVal("p", i);
      out.push({ go:"s:" + i, t1:"🏀 投籃大賽　#" + (i + 1) + "　" + pp[1], t2:pp[2] + (v !== null ? "｜預賽 " + v + " 分" : "｜預賽未登記") });
    }
  });
  if (!mealOnly) FUN_EVENTS.forEach(e => {
    if (e.name.toLowerCase().indexOf(q) >= 0) out.push({ go:"f:" + e.id, t1:"🎯 趣味競賽　" + e.name, t2:"[" + e.slot + "] " + e.t + "（" + e.v + "）" });
  });
  const MF = MEAL_FIELDS;
  // 餐點頁需在設定中勾選「顯示」後，才納入搜尋
  if (!(state.hidden && state.hidden.meal)) MEAL_ROWS.forEach(r => {
    const eng = r[MF.ROLE] === "同仁" ? (engFull(r[MF.NAME]) + " " + (MEAL_ENG[r[MF.NAME]] || "")) : "";
    if ((r[MF.NAME] + " " + eng + " " + r[MF.EID] + " " + r[MF.DEPT] + " " + unitOf(r[MF.NAME]) + " " + r[MF.TEAM]).toLowerCase().indexOf(q) >= 0) {
      out.push({ go:"e:" + r[MF.NO],
        t1:"🍔 餐點　" + r[MF.NAME] + "（" + r[MF.ROLE] + "）" + (r[MF.DIET] === "素食" ? "・素食" : "") + (mealTaken(r[MF.NO]) ? "・已領取" : ""),
        t2:r[MF.TEAM] + "｜" + r[MF.DEPT] + " " + r[MF.EID] + "｜" + mealShort(r[MF.MEAL]) + "＋" + drinkOf(r[MF.DRINK]) + (r[MF.OF] ? "｜眷屬（" + r[MF.OF] + "）" : "") });
    }
  });
  if (!out.length) { searchResults.innerHTML = '<div class="snone">找不到「' + esc(q) + '」相關結果</div>'; }
  else {
    searchResults.innerHTML = out.slice(0, 30).map(r =>
      '<div class="sresult" data-go="' + r.go + '"><div class="sr1">' + esc(r.t1) + '</div><div class="sr2">' + esc(r.t2) + "</div></div>").join("") +
      (out.length > 30 ? '<div class="snone">…共 ' + out.length + ' 筆，僅顯示前 30 筆</div>' : "");
  }
  searchResults.style.display = "block";
}
let foundTimer = null;
let toastTimer = null;
function showToast(text, ms) {
  const msg = document.getElementById("savemsg");
  msg.textContent = text;
  msg.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => msg.classList.remove("show"), ms || 3000);
}
function gotoTarget(go) {
  const kind = go.slice(0, 1), key = go.slice(2);
  stopPlay();
  searchResults.style.display = "none";
  let tab, elId;
  if (kind === "m") { tab = MATCHES[key].group; elId = "card-" + key; }
  else if (kind === "e") { tab = "meal"; elId = "mealrow-" + key; if (mealMode() === "sum") state.mealMode = "all"; }
  else if (kind === "s") { tab = "shoot"; elId = "shrow-" + key; }
  else { tab = "fun"; elId = "funcard-" + key; }
  state.tab = tab; save(); render();
  requestAnimationFrame(() => {
    const el = document.getElementById(elId);
    if (!el) {
      // 未領取名單中找不到 → 該筆已領取
      if (kind === "e") {
        const F = MEAL_FIELDS;
        const row = MEAL_ROWS.find(r => String(r[F.NO]) === String(key));
        if (row) {
          const en = row[F.ROLE] === "同仁" ? (MEAL_ENG[row[F.NAME]] || "") : "";
          showToast("✅ " + row[F.EID] + " - " + row[F.NAME] + (en ? "(" + en + ")" : "") + "　已領取", 3000);
        }
      }
      return;
    }
    el.scrollIntoView({ behavior:"smooth", block:"center", inline:"center" });
    document.querySelectorAll(".found").forEach(x => x.classList.remove("found", "fadeout"));
    el.classList.add("found");
    if (foundTimer) clearTimeout(foundTimer);
    // 持久顯示，直到使用者點擊滑鼠左鍵後淡出
    const dismiss = () => {
      el.classList.add("fadeout");
      foundTimer = setTimeout(() => el.classList.remove("found", "fadeout"), 900);
    };
    setTimeout(() => document.addEventListener("click", dismiss, { once:true }), 300);
  });
}
const searchClear = document.getElementById("searchClear");
function updateSearchClear() { searchClear.style.display = searchBox.value ? "block" : "none"; searchBox.classList.toggle("hasval", !!searchBox.value); }
searchClear.onclick = () => {
  searchBox.value = "";
  searchResults.style.display = "none";
  updateSearchClear();
  searchBox.focus();
};
searchBox.addEventListener("input", () => { updateSearchClear(); doSearch(searchBox.value); });
searchBox.addEventListener("focus", () => { if (searchBox.value.trim()) doSearch(searchBox.value); });
searchBox.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { searchBox.value = ""; searchResults.style.display = "none"; updateSearchClear(); }
  if (ev.key === "Enter") { const f = searchResults.querySelector(".sresult"); if (f) gotoTarget(f.getAttribute("data-go")); }
});
searchResults.addEventListener("click", ev => {
  const r = ev.target.closest(".sresult");
  if (r) gotoTarget(r.getAttribute("data-go"));
});
document.getElementById("conflictBar").addEventListener("click", ev => {
  const r = ev.target.closest(".clink");
  if (r) gotoTarget(r.getAttribute("data-go"));
});
document.addEventListener("click", ev => {
  if (!ev.target.closest(".searchwrap")) searchResults.style.display = "none";
});

/* 回到頂端 */
const topBtn = document.getElementById("topBtn");
function updateTopBtn() {
  const doc = document.scrollingElement || document.documentElement;
  topBtn.classList.toggle("show", doc.scrollTop > 200);
}
topBtn.onclick = () => { stopAutoScroll(); window.scrollTo({ top:0, behavior:"smooth" }); };
window.addEventListener("scroll", updateTopBtn, { passive:true });
updateTopBtn();

/* ===== 鍵盤快速鍵：←→切頁籤、空白鍵輪播、F全螢幕、Enter揭曉 ===== */
document.addEventListener("keydown", ev => {
  const t = ev.target;
  if (t && t.matches && t.matches("input, textarea, select")) return;             // 輸入中不攔截
  if (document.getElementById("timeModal").style.display === "flex") return;      // 時間視窗開啟時不攔截
  if (ev.key === "ArrowDown" && state.tab === "awards" && awStage < 3) {
    awardsAdvance();
    ev.preventDefault();
    return;
  }
  if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") {
    const vis = TAB_ORDER.filter(id => !(state.hidden && state.hidden[id]));
    let i = vis.indexOf(state.tab);
    if (i < 0) i = 0;
    i = (i + (ev.key === "ArrowRight" ? 1 : -1) + vis.length) % vis.length;
    state.tab = vis[i];
    save(); stopPlay(); render();
    ev.preventDefault();
  } else if (ev.key === " " || ev.code === "Space") {
    document.getElementById("playBtn").click();
    ev.preventDefault();
  } else if (ev.key === "f" || ev.key === "F") {
    document.getElementById("fsBtn").click();
  }
});

/* ===== 自動存版：每 1 分鐘一版，環形保留 60 版 ===== */
const SNAP_KEY = "jc_fd2026_snaps_v1";
const SNAP_MAX = 60;
function loadSnaps() {
  try { const a = JSON.parse(localStorage.getItem(SNAP_KEY) || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function saveSnaps(a) { try { localStorage.setItem(SNAP_KEY, JSON.stringify(a)); } catch (e) {} }
function snapshotNow(manual) {
  const arr = loadSnaps();
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  const stamp = p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  const done = Object.keys(MATCHES).filter(k => winnerOf(MATCHES[k])).length;
  const meals = Object.keys(state.mealTaken || {}).length;
  const body = JSON.stringify(Object.assign({}, state, { theme:curTheme }));
  // 與最後一版相同則不重複存（手動除外）
  if (!manual && arr.length && arr[arr.length - 1].body === body) return false;
  arr.push({ t:stamp, done:done, meals:meals, manual:!!manual, body:body });
  while (arr.length > SNAP_MAX) arr.shift();      // 超過 60 版丟掉最舊的
  saveSnaps(arr);
  if (panel.classList.contains("open")) fillSnapSelect();
  return true;
}
function fillSnapSelect() {
  const sel = document.getElementById("snapSel");
  if (!sel) return;
  const arr = loadSnaps();
  if (!arr.length) { sel.innerHTML = '<option value="">（尚無自動存版）</option>'; return; }
  sel.innerHTML = arr.map((x, i) =>
    '<option value="' + i + '">' + esc("#" + (i + 1) + "　" + x.t + (x.manual ? "（手動）" : "") + "　完賽 " + x.done + " 場") + "</option>"
  ).reverse().join("");
  sel.selectedIndex = 0;
}
document.getElementById("snapNow").onclick = () => { snapshotNow(true); fillSnapSelect(); showToast("💾 已存一版", 1800); };
document.getElementById("snapRestore").onclick = () => {
  const sel = document.getElementById("snapSel");
  const i = Number(sel.value);
  const arr = loadSnaps();
  if (!sel.value || !arr[i]) { alert("請先選擇要還原的版本"); return; }
  if (!confirm("確定還原至「" + arr[i].t + "」這一版？\n目前的資料會先自動存成一版，之後仍可還原回來。")) return;
  snapshotNow(true);                                  // 還原前先備份現況
  try {
    const snap = JSON.parse(arr[i].body);
    const th = snap.theme; delete snap.theme;
    state = Object.assign(state, snap);
    save();
    if (th) applyTheme(th);
    render(); fillPanel(); fillSnapSelect();
    showToast("↩ 已還原至 " + arr[i].t, 2500);
  } catch (e) { alert("還原失敗：資料格式錯誤"); }
};
setInterval(() => snapshotNow(false), 1 * 60 * 1000);
setTimeout(() => snapshotNow(false), 3000);           // 開頁 3 秒後先存一版

/* 時鐘 */
setInterval(() => {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  document.getElementById("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}, 500);

render();
</script>
