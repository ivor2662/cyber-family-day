<style>

  .navtab.active{color:var(--ink); border-bottom-color:var(--gold);}

  .searchrow{padding:10px 16px 0;}
  #q{
    width:100%; border:1.5px solid var(--line); background:var(--card); color:var(--ink);

  #q:focus{outline:none; border-color:var(--gold);}
  .chips{display:flex; gap:8px; padding:10px 16px 12px; overflow-x:auto;}
  .chip{
    flex:none; font-size:13.5px; font-weight:700; padding:7px 14px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--card); color:var(--sub); white-space:nowrap;
  }
  .chip.active{color:#fff; border-color:transparent;}
  .chip[data-s="all"].active{background:#3a4250;}
  .chip[data-s="tt"].active{background:var(--tt);}
  .chip[data-s="bad"].active{background:var(--bad);}
  .chip[data-s="bb"].active{background:var(--bb);}

  #grpChips .chip.active[data-sport="bad"]{background:var(--bad);}
  #grpChips .chip.active[data-sport="bb"]{background:var(--bb);}

  .card.bad{border-left-color:var(--bad);}
  .card.bb{border-left-color:var(--bb);}

  .card.done{opacity:.68;}
  .row1{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .tag{font-size:11.5px; font-weight:700;}
  .card.tt .tag{color:var(--tt);}
  .card.bad .tag{color:var(--bad);}
  .card.bb .tag{color:var(--bb);}

window.addEventListener("error", ev => {
  const b = document.getElementById("debugBanner");
  if (!b) return;
  b.style.display = "block";
  b.textContent = "⚠ 頁面錯誤：" + (ev.message || "未知錯誤") +
    (ev.filename ? "　來源：" + ev.filename + ":" + ev.lineno + ":" + ev.colno : "");
});
window.addEventListener("unhandledrejection", ev => {
  const b = document.getElementById("debugBanner");
  if (!b) return;
  b.style.display = "block";
  b.textContent = "⚠ 未處理的 Promise 錯誤：" + (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason));
});

const MATCHES = {};

function funScore(id){
  const f = liveFun[id];
  if (!f) return null;
  if (f.r === "" || f.w === "" || f.r == null || f.w == null) return null;
  return { r:Number(f.r), w:Number(f.w) };
}

/* 未產生勝負前的佔位文字（例如「16強勝者1」） */
function phWin(id){ const lb = MATCHES[id].lb; return lb.indexOf("冠軍賽") >= 0 ? "冠軍" : lb.replace(/-(\d+)$/, "勝者$1"); }
function phLose(id){ return MATCHES[id].lb.replace(/-(\d+)$/, "敗者$1"); }

/* 依即時比分（liveScores）判斷晉級者，邏輯與主控版一致 */
function scoreOf(id){
  const s = liveScores[id];
  if (!s) return null;
  if (s.a === "" || s.b === "" || s.a == null || s.b == null) return null;
  return { a:Number(s.a), b:Number(s.b) };
}
function resolveEntrant(e){
  if (!e) return { text:"", ok:false, bye:false };
  if (e.bye) return { text:"輪空", ok:false, bye:true };
  if (e.name) return { text:e.name, ok:true, bye:false };
  if (e.win)  { const w = winnerOf(MATCHES[e.win]); return w ? { text:w, ok:true, bye:false } : { text:phWin(e.win), ok:false, bye:false }; }
  if (e.lose) { const l = loserOf(MATCHES[e.lose]); return l ? { text:l, ok:true, bye:false } : { text:phLose(e.lose), ok:false, bye:false }; }
  return { text:"", ok:false, bye:false };
}
function winnerOf(m){
  if (!m) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  if (m.b && m.b.bye) return A.ok ? A.text : null;
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  const side = s.a > s.b ? A : B;
  return side.ok ? side.text : null;
}
function loserOf(m){
  if (!m) return null;
  if (m.b && m.b.bye) return null;
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  const s = scoreOf(m.id);
  if (!s || s.a === s.b) return null;
  const side = s.a > s.b ? B : A;
  return side.ok ? side.text : null;
}
function getTime(m){ return (liveTimes && liveTimes[m.id]) || m.t; }

const VENUE_LABEL = { "桌1":"🏓 桌1", "桌2":"🏓 桌2", "桌3":"🏓 桌3", "A面":"🏸 羽球A面", "B面":"🏸 羽球B面", "籃球場":"🏀 籃球場" };
const SPORT_LABEL = { tt:"桌球", bad:"羽球", bb:"籃球" };

function parseRange(t){
  const m = /^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/.exec(t);
  if (!m) return null;
  return { a:(+m[1])*60+(+m[2]), b:(+m[3])*60+(+m[4]) };
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function fmtHM(min){ const h = Math.floor(min/60), m = min%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }

const MATCH_LIST = Object.keys(MATCHES).map(k => MATCHES[k]);
let state = { view:"schedule", s:"all", q:"", grp:GROUPS[0].id };
let nowMin = 0;

function sideHTML(side, winnerText){
  const isWinner = winnerText && side.ok && side.text === winnerText;
  const label = side.bye ? "輪空" : side.text;
  const cls = side.ok ? "" : "ph";
  return '<span class="' + cls + '">' + (isWinner ? "🏆 " : "") + esc(label) + '</span>';
}

/* 單一場次卡片，賽程表與對戰表共用；showTime=true 時額外顯示時間（對戰表用，賽程表已用時段標題分組） */
function matchCardHTML(m, showTime){
  const r = parseRange(getTime(m));
  const A = resolveEntrant(m.a), B = resolveEntrant(m.b);
  const w = winnerOf(m);
  const s = scoreOf(m.id);
  const isDone = !!w;
  const isLive = !isDone && r && nowMin >= r.a;
  const cls = ["card", m.sport, isLive ? "live" : "", isDone ? "done" : ""].filter(Boolean).join(" ");
  const timeTxt = showTime && getTime(m) && getTime(m) !== "—" ? esc(getTime(m)) + "　" : "";
  const scoreTxt = s ? '<span class="scorebadge">' + s.a + ' : ' + s.b + '</span>' : "";
  return '<div class="' + cls + '">' +
    '<div class="row1"><span class="tag">' + SPORT_LABEL[m.sport] + ' · ' + esc(m.gname) + '　' + esc(m.lb) + (m.crown ? "（"+m.crown+"）" : "") + '</span></div>' +
    '<div class="venue">' + timeTxt + (VENUE_LABEL[m.v] || esc(m.v || "")) + '</div>' +
    '<div class="vs">' +
      '<span class="vsnames">' + sideHTML(A, w) + '<span class="vsmid">vs</span>' + sideHTML(B, w) + '</span>' +
      scoreTxt +
    '</div>' +
    (isDone ? '<div class="foot">✓ 已產生結果</div>' : "") +
  '</div>';
}

function renderSchedule(){
  const q = state.q.trim().toLowerCase();
  const items = MATCH_LIST.map(m => ({ m, r: parseRange(getTime(m)) }))
    .sort((x, y) => {
      const ax = x.r ? x.r.a : 9999, ay = y.r ? y.r.a : 9999;
      if (ax !== ay) return ax - ay;
      return (x.m.v || "").localeCompare(y.m.v || "");
    });
  const filtered = items.filter(it => {
    if (state.s !== "all" && it.m.sport !== state.s) return false;
    if (!q) return true;
    const A = resolveEntrant(it.m.a).text, B = resolveEntrant(it.m.b).text;
    const hay = (it.m.gname + " " + it.m.lb + " " + A + " " + B).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  if (!filtered.length) return '<div class="empty">找不到符合的賽程</div>';
  let html = "", lastSlot = null;
  filtered.forEach(it => {
    const slotLabel = it.r ? (fmtHM(it.r.a) + " – " + fmtHM(it.r.b)) : "時間未定";
    if (slotLabel !== lastSlot) {
      const n = filtered.filter(x => (x.r ? fmtHM(x.r.a)+" – "+fmtHM(x.r.b) : "時間未定") === slotLabel).length;
      html += '<div class="slot">' + esc(slotLabel) + '<span class="n">' + n + ' 場</span></div>';
      lastSlot = slotLabel;
    }
    html += matchCardHTML(it.m, false);
  });
  return html;
}

function renderBracket(){
  const g = GROUPS.find(x => x.id === state.grp) || GROUPS[0];
  let html = "";
  g.cols.forEach(col => {
    html += '<div class="round">' + esc(col.title) + '<span class="n">' + col.ms.length + ' 場</span></div>';
    col.ms.forEach(m => { html += matchCardHTML(m, true); });
  });
  return html;
}

function renderFun(){
  let winR = 0, winW = 0, doneN = 0;
  FUN_EVENTS.forEach(e => {
    const sc = funScore(e.id);
    if (!sc) return;
    doneN++;
    if (sc.r > sc.w) winR++; else if (sc.w > sc.r) winW++;
  });
  const finished = doneN === FUN_EVENTS.length;
  const status = finished ? (winR === winW ? "🤝 雙方平手" : "🏆 " + (winR > winW ? "紅隊優勝" : "白隊優勝"))
                          : (winR > winW ? "紅隊領先" : (winW > winR ? "白隊領先" : "戰況膠著"));
  let html = '<div class="funtotal">' +
    '<div class="funteam red"><div class="tname">紅隊</div><div class="tbig">' + winR + '<small>勝</small></div>' +
    '<div class="tcap">👑 ' + CAPTAINS["紅隊"].join("、") + '</div></div>' +
    '<div class="funmid">VS<br>' + status + '</div>' +
    '<div class="funteam white"><div class="tname">白隊</div><div class="tbig">' + winW + '<small>勝</small></div>' +
    '<div class="tcap">👑 ' + CAPTAINS["白隊"].join("、") + '</div></div>' +
  '</div>';
  html += '<div class="foot" style="text-align:center;margin-bottom:10px;">共 ' + FUN_EVENTS.length + ' 項，已完成 ' + doneN + '/' + FUN_EVENTS.length + '</div>';
  FUN_EVENTS.forEach(e => {
    const sc = funScore(e.id);
    const rw = sc && sc.r > sc.w, ww = sc && sc.w > sc.r;
    html += '<div class="funcard">' +
      '<h3>' + esc(e.name) + '</h3>' +
      '<div class="fmeta">' + esc(e.t) + '　' + esc(e.v) + '　' + esc(e.slot) + '</div>' +
      '<div class="funside' + (rw ? " win" : "") + '">🔴 紅隊<span>' + (sc ? sc.r : "—") + '</span></div>' +
      '<div class="funside' + (ww ? " win" : "") + '">⚪ 白隊<span>' + (sc ? sc.w : "—") + '</span></div>' +
      (sc ? '<div class="funresult">' + (sc.r === sc.w ? "🤝 平手" : "🏆 " + (rw ? "紅隊" : "白隊") + "勝") + '</div>' : "") +
    '</div>';
  });
  return html;
}

function render(){
  const now = new Date();
  nowMin = now.getHours()*60 + now.getMinutes();

  const main = document.getElementById("main");
  if (state.view === "schedule") main.innerHTML = renderSchedule();
  else if (state.view === "bracket") main.innerHTML = renderBracket();
  else main.innerHTML = renderFun();

  const statusText = fbStatus === "live" ? "🟢 比分即時同步中" : fbStatus === "offline" ? "🔴 比分同步離線（顯示靜態資料）" : "🟡 比分同步連線中…";
  document.getElementById("updated").textContent = "更新時間 " + fmtHM(nowMin) + "　｜　" + statusText;
}

/* ===== 對戰表：賽事分類選單 ===== */
const grpChips = document.getElementById("grpChips");
grpChips.innerHTML = GROUPS.map(g =>
  '<div class="chip' + (g.id === state.grp ? " active" : "") + '" data-grp="' + g.id + '" data-sport="' + g.sport + '">' +
  (g.sport === "tt" ? "🏓 " : g.sport === "bad" ? "🏸 " : "🏀 ") + esc(g.name) + '</div>'
).join("");
grpChips.addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  grpChips.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.grp = c.getAttribute("data-grp");
  render();
});

/* ===== 主頁籤切換 ===== */
document.getElementById("nav").addEventListener("click", ev => {
  const t = ev.target.closest(".navtab");
  if (!t) return;
  document.querySelectorAll(".navtab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  state.view = t.getAttribute("data-v");
  document.getElementById("scheduleControls").style.display = state.view === "schedule" ? "" : "none";
  document.getElementById("bracketControls").style.display = state.view === "bracket" ? "" : "none";
  render();
});

document.getElementById("chips").addEventListener("click", ev => {
  const c = ev.target.closest(".chip");
  if (!c) return;
  document.querySelectorAll("#chips .chip").forEach(x => x.classList.remove("active"));
  c.classList.add("active");
  state.s = c.getAttribute("data-s");
  render();
});
document.getElementById("q").addEventListener("input", ev => { state.q = ev.target.value; render(); });

render();
setInterval(render, 30000);
</script>
</body>
